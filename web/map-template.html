<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    --ground: #eef0f3;
    --surface: #ffffff;
    --surface-sunk: #f7f8fa;
    --ink: #15181d;
    --ink-muted: #5b6270;
    --line: #d5d9e0;
    --line-strong: #b6bcc7;
    --accent: #2b4ea2;
    --accent-soft: #dbe2f4;
    --open: #9a6410;
    --open-soft: #f6e8cf;
    --decided: #14724a;
    --decided-soft: #d5eadd;
    --rejected: #8c4a4a;
    --rejected-soft: #f0dcdc;
    /* An aspect says which part of the design a node belongs to; a status says
       where the question stands. The two palettes are kept in different hue
       families — violet, cyan and magenta against blue, amber, green and red —
       because an aspect drawn in a status hue is read as that status. */
    --aspect-1: #6a3fa0;
    --aspect-2: #0b6e8f;
    --aspect-3: #a8386b;
    --shadow: 0 1px 2px rgba(21, 24, 29, .07), 0 8px 24px rgba(21, 24, 29, .06);

    --step-micro: .6875rem;
    --step-0: .8125rem;
    --step-1: .9375rem;
    --step-2: 1.0625rem;
    --step-3: 1.375rem;

    /* One gutter for every plate: the stage and the dock meet at the splitter,
       and a difference in padding shows there. */
    --gutter: 1rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131519;
      --surface: #1a1d23;
      --surface-sunk: #16191e;
      --ink: #e6e9ee;
      --ink-muted: #98a1b0;
      --line: #2a2f38;
      --line-strong: #3d444f;
      --accent: #86a6f2;
      --accent-soft: #22304d;
      --open: #d7a445;
      --open-soft: #362b16;
      --decided: #4fc08c;
      --decided-soft: #123227;
      --rejected: #cb8888;
      --rejected-soft: #37211f;
      --aspect-1: #b79bf0;
      --aspect-2: #56b9d8;
      --aspect-3: #e58ab4;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .35);
    }
  }

  :root[data-theme="dark"] {
    --ground: #131519;
    --surface: #1a1d23;
    --surface-sunk: #16191e;
    --ink: #e6e9ee;
    --ink-muted: #98a1b0;
    --line: #2a2f38;
    --line-strong: #3d444f;
    --accent: #86a6f2;
    --accent-soft: #22304d;
    --open: #d7a445;
    --open-soft: #362b16;
    --decided: #4fc08c;
    --decided-soft: #123227;
    --rejected: #cb8888;
    --rejected-soft: #37211f;
    --aspect-1: #b79bf0;
    --aspect-2: #56b9d8;
    --aspect-3: #e58ab4;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }

  /* One thin scrollbar everywhere, in the page's own colours. */
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

  *::-webkit-scrollbar { width: 7px; height: 7px; }
  *::-webkit-scrollbar-track { background: transparent; }

  *::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
  }

  *::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); background-clip: content-box; }
  *::-webkit-scrollbar-corner { background: transparent; }

  body {
    margin: 0;
    height: 100vh;
    /* Mobile browsers count the address bar into 100vh; dvh follows it. */
    height: 100dvh;
    display: grid;
    grid-template-rows: minmax(0, 1fr);
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: var(--step-1);
    line-height: 1.5;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
    flex-wrap: wrap;
    padding: .75rem var(--gutter);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  h1 {
    position: relative;
    margin: 0;
    font-size: var(--step-2);
    font-weight: 600;
    letter-spacing: .01em;
  }

  /* The map's name opens the other maps of the project: they are served under
     one address each, and moving between them otherwise means typing a path. */
  .map-button {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    padding: 0;
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
  }

  .map-button:hover, .map-button[aria-expanded="true"] { color: var(--accent); }
  .map-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .map-menu {
    position: absolute;
    top: calc(100% + .45rem);
    left: 0;
    z-index: 15;
    min-width: 17rem;
    padding: .3rem;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .map-menu[hidden] { display: none; }

  .map-item {
    display: flex;
    align-items: baseline;
    gap: .75rem;
    padding: .3rem .5rem;
    font-size: var(--step-0);
    font-weight: 400;
    color: var(--ink);
    text-decoration: none;
    border-radius: 5px;
  }

  .map-item code {
    margin-left: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: var(--step-micro);
    color: var(--ink-muted);
  }

  .map-item:hover { background: var(--surface-sunk); }
  .map-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .map-item[aria-current="page"] { color: var(--accent); }

  .source {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: var(--step-0);
    color: var(--ink-muted);
  }

  .tally {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: var(--step-0);
    color: var(--ink-muted);
  }

  .tally .count {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    font-variant-numeric: tabular-nums;
  }

  .tally .count b {
    font-weight: 600;
    color: var(--ink);
  }

  .tally .count::before {
    content: "";
    width: .55rem;
    height: .55rem;
    border-radius: 50%;
    background: currentColor;
  }

  .tally .count.open { color: var(--open); }
  .tally .count.decided { color: var(--decided); }
  .tally .count.rejected { color: var(--rejected); }

  .tally .progress {
    width: 5rem;
    height: .35rem;
    border-radius: 2px;
    background: var(--open-soft);
    overflow: hidden;
  }

  .tally .progress i {
    display: block;
    height: 100%;
    background: var(--decided);
  }

  .legend {
    margin-left: auto;
    display: flex;
    gap: 1rem;
    align-items: center;
    font-size: var(--step-0);
    color: var(--ink-muted);
  }

  .legend span { display: inline-flex; align-items: center; gap: .4rem; }

  .swatch { width: .7rem; height: .7rem; border: 1.5px solid currentColor; }
  .swatch.aspect { border-radius: 2px; color: var(--accent); background: var(--accent-soft); }
  .swatch.question { transform: rotate(45deg); color: var(--open); background: var(--open-soft); }
  .swatch.decision { border-radius: 50%; color: var(--decided); background: var(--decided-soft); }
  .swatch.rejected { border-radius: 50%; color: var(--rejected); background: var(--rejected-soft); border-style: dashed; }

  main {
    --dock: clamp(20rem, 32%, 30rem);
    display: grid;
    min-height: 0;
  }

  /* How tall the record stands when nobody has dragged it: as tall as it needs
     in a stack, a fixed column when the panes stand side by side. A drag writes
     a length onto `main` itself, and that inline value beats both. */
  main[data-flow="stack"] { --record: auto; }
  main[data-flow="row"] { --record: 16rem; }

  /* Side: the dock stands against one edge of the graph, the full height of the
     window. The title and the aspect strip belong to the graph, not to both. */
  main[data-layout="side"] {
    grid-template-columns: minmax(0, 1fr) auto var(--dock);
    grid-template-rows: minmax(0, 1fr);
  }

  main[data-layout="side"][data-side="left"] {
    grid-template-columns: var(--dock) auto minmax(0, 1fr);
  }

  main[data-layout="side"][data-side="left"] .dock { order: 1; border-right: 1px solid var(--line); border-left: none; }
  main[data-layout="side"][data-side="left"] > .split { order: 2; }
  main[data-layout="side"][data-side="left"] .stage { order: 3; }

  main[data-layout="side"] .dock { border-left: 1px solid var(--line); }

  /* Bottom: the dock lies under the graph. */
  main[data-layout="bottom"] {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto var(--dock);
  }

  main[data-layout="bottom"] .dock { border-top: 1px solid var(--line); }

  .stage {
    display: grid;
    /* The single column is capped: an auto track takes the width of its widest
       child, and the header and the strip then reach past a phone's screen. */
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
    background: var(--surface);
  }

  .graph { position: relative; min-width: 0; min-height: 0; overflow: hidden; }

  .dock {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
    background: var(--surface);
  }

  /* Inside the dock the two panes either stack or stand side by side. */
  .dock-body { display: grid; min-width: 0; min-height: 0; }

  main[data-flow="stack"] .dock-body { grid-template-rows: var(--record) auto minmax(0, 1fr); }
  main[data-flow="row"] .dock-body { grid-template-columns: var(--record) auto minmax(0, 1fr); }
  main[data-flow="stack"][data-order="chat-first"] .dock-body { grid-template-rows: minmax(0, 1fr) auto var(--record); }
  main[data-flow="row"][data-order="chat-first"] .dock-body { grid-template-columns: minmax(0, 1fr) auto var(--record); }

  main[data-order="chat-first"] .record-pane { order: 3; }
  main[data-order="chat-first"] .chat-pane { order: 1; }
  main[data-order="chat-first"] .dock-body > .split { order: 2; }

  /* A folded pane keeps its head and gives up the rest of the track. */
  main[data-fold="record"][data-flow="stack"] .dock-body { grid-template-rows: auto 0 minmax(0, 1fr); }
  main[data-fold="record"][data-flow="row"] .dock-body { grid-template-columns: auto 0 minmax(0, 1fr); }
  main[data-fold="chat"][data-flow="stack"] .dock-body { grid-template-rows: minmax(0, 1fr) 0 auto; }
  main[data-fold="chat"][data-flow="row"] .dock-body { grid-template-columns: minmax(0, 1fr) 0 auto; }
  main[data-fold] .dock-body > .split { visibility: hidden; }
  main[data-fold="record"] .record-pane > :not(.pane-head) { display: none; }
  main[data-fold="chat"] .chat-pane > :not(.pane-head) { display: none; }

  .pane {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }

  main[data-flow="row"] .pane { min-width: 14rem; }

  /* A record nobody has dragged takes what it needs, up to a share of the dock,
     so the conversation keeps the rest instead of holding empty space. The drag
     lifts the cap: a pane that refuses to follow the handle reads as broken. */
  main[data-flow="stack"] .record-pane { max-height: var(--record-cap, 60vh); }

  /* With the conversation folded away there is nothing to leave room for. */
  main[data-fold="chat"] .record-pane { max-height: none; }

  .pane-body { overflow-y: auto; min-height: 0; align-content: start; padding: .8rem var(--gutter); }

  .chat-pane {
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: .55rem;
    padding-bottom: .8rem;
    min-height: 0;
  }

  .chat-pane .chat-log, .chat-pane .chat-options, .chat-pane .compose { margin: 0 var(--gutter); }
  .chat-pane .chat-log { margin-top: .25rem; }

  /* The top of the dock: who is on the other end, and where the panels sit. */
  .dock-head {
    position: relative;
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .45rem .6rem .45rem var(--gutter);
    border-bottom: 1px solid var(--line);
    background: var(--surface-sunk);
  }

  .dock-tools { margin-left: auto; display: flex; align-items: center; gap: .3rem; }

  .layout-button {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    padding: .2rem .35rem;
    color: var(--ink-muted);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    cursor: pointer;
  }

  .layout-button:hover, .layout-button[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .layout-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .layout-card {
    position: absolute;
    top: calc(100% + .35rem);
    right: .5rem;
    z-index: 15;
    width: 15.5rem;
    padding: .75rem;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .layout-card[hidden] { display: none; }

  .layout-card .card-label { display: block; margin-bottom: .55rem; }

  .layout-card .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .4rem; }

  .layout-card .grid button {
    display: grid;
    justify-items: center;
    padding: .45rem .3rem .35rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  .layout-card .grid button:hover { border-color: var(--line-strong); }
  .layout-card .grid button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layout-card .grid button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  .layout-card .swap {
    display: flex;
    align-items: center;
    gap: .5rem;
    width: 100%;
    margin-top: .65rem;
    padding-top: .6rem;
    border-top: 1px solid var(--line);
    font: inherit;
    font-size: var(--step-0);
    color: var(--ink-muted);
    background: none;
    border-left: none;
    border-right: none;
    border-bottom: none;
    cursor: pointer;
  }

  .layout-card .swap:hover, .layout-card .swap:focus-visible { color: var(--accent); outline: none; }
  .layout-card .swap svg { margin-left: auto; }

  /* Each pane says what it is and folds from its own head. */
  .pane-head {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .4rem .6rem .4rem var(--gutter);
    border-bottom: 1px solid var(--line);
    min-width: 0;
  }

  .pane-name { flex: none; }

  .fold {
    margin-left: auto;
    display: inline-flex;
    padding: .2rem;
    color: var(--ink-muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    flex: none;
  }

  .fold:hover { color: var(--accent); border-color: var(--line-strong); }
  .fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* The handle between panels: drag to resize. A bar filled with one colour is
     the shape of a scrollbar, so the handle draws a hairline seam with a short
     grip across its middle instead. The four lengths below carry the axis, so
     the seam and the grip need no rules of their own per arrangement. */
  .split {
    position: relative;
    background: transparent;
    touch-action: none;
    --seam-w: 100%;
    --seam-h: 1px;
    --grip-w: 1.75rem;
    --grip-h: 3px;
  }

  .split::before, .split::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
  }

  .split::before { width: var(--seam-w); height: var(--seam-h); background: var(--line); }

  .split::after {
    width: var(--grip-w);
    height: var(--grip-h);
    border-radius: 999px;
    background: var(--line-strong);
  }

  main[data-layout="side"] > .split,
  main[data-flow="row"] .dock-body > .split {
    width: 9px;
    height: auto;
    cursor: col-resize;
    --seam-w: 1px;
    --seam-h: 100%;
    --grip-w: 3px;
    --grip-h: 1.75rem;
  }

  main[data-layout="bottom"] > .split,
  main[data-flow="stack"] .dock-body > .split { height: 9px; width: auto; cursor: row-resize; }

  .split:hover::after, .split:focus-visible::after { background: var(--accent); }
  .split:focus-visible { outline: none; }



  #canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    background:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0 / 28px 28px;
  }

  #canvas.dragging { cursor: grabbing; }

  .edge {
    fill: none;
    stroke: var(--edge-color, var(--line-strong));
    stroke-width: 1.5;
    opacity: .8;
  }
  .edge.rejects, .edge.needs { stroke-dasharray: 4 3; }
  .edge.lit { stroke-width: 2.5; opacity: 1; }

  .node { cursor: pointer; }
  .node .plate {
    fill: var(--surface);
    stroke: var(--line-strong);
    stroke-width: 1;
    rx: 5;
  }
  .node .title { font-size: 13px; fill: var(--ink); }
  .node .kind {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    letter-spacing: .08em;
    fill: var(--ink-muted);
  }
  .node .mark { stroke-width: 1.5; }

  .node[data-kind="aspect"] .plate {
    fill: color-mix(in srgb, var(--aspect-color, var(--accent)) 12%, var(--surface));
    stroke: var(--aspect-color, var(--accent));
    stroke-width: 1.75;
  }
  .node[data-kind="aspect"] .mark {
    fill: var(--aspect-color, var(--accent));
    stroke: var(--aspect-color, var(--accent));
  }
  .node[data-kind="question"] .mark { fill: var(--open-soft); stroke: var(--open); }
  .node[data-kind="decision"] .mark { fill: var(--decided-soft); stroke: var(--decided); }
  .node[data-kind="rejected"] .mark { fill: var(--rejected-soft); stroke: var(--rejected); stroke-dasharray: 3 2; }
  .node[data-kind="module"] .mark { fill: var(--accent-soft); stroke: var(--accent); }
  .node[data-kind="knowledge"] .mark { fill: var(--decided-soft); stroke: var(--decided); }
  .node[data-kind="dependency"] .mark { fill: var(--open-soft); stroke: var(--open); stroke-dasharray: 3 2; }
  .node[data-kind="rejected"] .title { fill: var(--ink-muted); }

  .node:hover .plate { stroke: var(--aspect-color, var(--accent)); stroke-width: 1.5; }

  .hide-btn { cursor: pointer; opacity: 0; }
  .hide-btn circle { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
  .hide-btn line { stroke: var(--ink-muted); stroke-width: 1.4; stroke-linecap: round; }
  .node:hover .hide-btn, .node:focus-within .hide-btn, .hide-btn:focus-visible { opacity: 1; }
  .hide-btn:hover circle { stroke: var(--rejected); }
  .hide-btn:hover line { stroke: var(--rejected); }
  .hide-btn:focus-visible circle { stroke: var(--accent); stroke-width: 2; }

  @media (prefers-reduced-motion: no-preference) {
    .hide-btn { transition: opacity .12s ease-out; }
  }

  .aspect-bar {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .5rem var(--gutter);
    border-bottom: 1px solid var(--line);
    background: var(--surface-sunk);
  }

  /* What is on the map on the left, what to do next on the right, with a rule
     between them: filters and commands answer different questions. */
  .bar-filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .4rem;
    min-width: 0;
  }

  .bar-actions {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex: none;
    margin-left: auto;
    padding-left: .75rem;
    border-left: 1px solid var(--line-strong);
  }

  .chip {
    font: inherit;
    font-size: var(--step-0);
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    padding: .15rem .65rem .15rem .5rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--aspect-color, var(--line-strong));
    border-radius: 999px;
    cursor: pointer;
  }

  .chip .dot {
    width: .6rem;
    height: .6rem;
    border-radius: 2px;
    background: var(--aspect-color, var(--line-strong));
  }

  .chip .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: var(--step-micro);
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  /* Questions still open on this aspect, in the colour the map gives them. */
  .chip .pip {
    width: .45rem;
    height: .45rem;
    border-radius: 50%;
    background: var(--open);
  }

  .chip[aria-pressed="false"] {
    border-style: dashed;
    color: var(--ink-muted);
    background: transparent;
  }

  .chip[aria-pressed="false"] .dot { background: transparent; border: 1px solid var(--aspect-color, var(--line-strong)); }

  .chip:hover { border-style: solid; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .aspect-bar .reset {
    font: inherit;
    font-size: var(--step-0);
    padding: .15rem .5rem;
    color: var(--ink-muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
