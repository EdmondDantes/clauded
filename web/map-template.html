<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">

<style>
  :root {
    --ground: #eef0f3;
    --surface: #ffffff;
    --surface-sunk: #f7f8fa;
    --ink: #15181d;
    --ink-muted: #5b6270;
    --line: #d5d9e0;
    --line-strong: #b6bcc7;
    --accent: #2b4ea2;
    --accent-soft: #dbe2f4;
    --open: #9a6410;
    --open-soft: #f6e8cf;
    --decided: #16705a;
    --decided-soft: #d6ebe4;
    --rejected: #8c4a4a;
    --rejected-soft: #f0dcdc;
    --aspect-1: #3450a8;
    --aspect-2: #12665f;
    --aspect-3: #7a3f83;
    --shadow: 0 1px 2px rgba(21, 24, 29, .07), 0 8px 24px rgba(21, 24, 29, .06);

    --step-0: .8125rem;
    --step-1: .9375rem;
    --step-2: 1.0625rem;
    --step-3: 1.375rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131519;
      --surface: #1a1d23;
      --surface-sunk: #16191e;
      --ink: #e6e9ee;
      --ink-muted: #98a1b0;
      --line: #2a2f38;
      --line-strong: #3d444f;
      --accent: #86a6f2;
      --accent-soft: #22304d;
      --open: #d7a445;
      --open-soft: #362b16;
      --decided: #55c2a0;
      --decided-soft: #14322a;
      --rejected: #cb8888;
      --rejected-soft: #37211f;
      --aspect-1: #8ba7f2;
      --aspect-2: #4fb8ae;
      --aspect-3: #c48fd2;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .35);
    }
  }

  :root[data-theme="dark"] {
    --ground: #131519;
    --surface: #1a1d23;
    --surface-sunk: #16191e;
    --ink: #e6e9ee;
    --ink-muted: #98a1b0;
    --line: #2a2f38;
    --line-strong: #3d444f;
    --accent: #86a6f2;
    --accent-soft: #22304d;
    --open: #d7a445;
    --open-soft: #362b16;
    --decided: #55c2a0;
    --decided-soft: #14322a;
    --rejected: #cb8888;
    --rejected-soft: #37211f;
    --aspect-1: #8ba7f2;
    --aspect-2: #4fb8ae;
    --aspect-3: #c48fd2;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }

  /* One thin scrollbar everywhere, in the page's own colours. */
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

  *::-webkit-scrollbar { width: 7px; height: 7px; }
  *::-webkit-scrollbar-track { background: transparent; }

  *::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
  }

  *::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); background-clip: content-box; }
  *::-webkit-scrollbar-corner { background: transparent; }

  body {
    margin: 0;
    height: 100vh;
    /* Mobile browsers count the address bar into 100vh; dvh follows it. */
    height: 100dvh;
    display: grid;
    grid-template-rows: auto auto 1fr;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: var(--step-1);
    line-height: 1.5;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
    flex-wrap: wrap;
    padding: .75rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  h1 {
    margin: 0;
    font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif;
    font-size: var(--step-2);
    font-weight: 600;
    letter-spacing: .01em;
  }

  .source {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: var(--step-0);
    color: var(--ink-muted);
  }

  .tally {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: var(--step-0);
    color: var(--ink-muted);
  }

  .tally .count {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    font-variant-numeric: tabular-nums;
  }

  .tally .count b {
    font-weight: 600;
    color: var(--ink);
  }

  .tally .count::before {
    content: "";
    width: .55rem;
    height: .55rem;
    border-radius: 50%;
    background: currentColor;
  }

  .tally .count.open { color: var(--open); }
  .tally .count.decided { color: var(--decided); }
  .tally .count.rejected { color: var(--rejected); }

  .tally .progress {
    width: 5rem;
    height: .35rem;
    border-radius: 2px;
    background: var(--open-soft);
    overflow: hidden;
  }

  .tally .progress i {
    display: block;
    height: 100%;
    background: var(--decided);
  }

  .legend {
    margin-left: auto;
    display: flex;
    gap: 1rem;
    align-items: center;
    font-size: var(--step-0);
    color: var(--ink-muted);
  }

  .legend span { display: inline-flex; align-items: center; gap: .4rem; }

  .swatch { width: .7rem; height: .7rem; border: 1.5px solid currentColor; }
  .swatch.aspect { border-radius: 2px; color: var(--accent); background: var(--accent-soft); }
  .swatch.question { transform: rotate(45deg); color: var(--open); background: var(--open-soft); }
  .swatch.decision { border-radius: 50%; color: var(--decided); background: var(--decided-soft); }
  .swatch.rejected { border-radius: 50%; color: var(--rejected); background: var(--rejected-soft); border-style: dashed; }

  main {
    --dock: clamp(20rem, 32%, 30rem);
    --record: 16rem;
    display: grid;
    min-height: 0;
  }

  /* Side: the dock stands against one edge of the graph. */
  main[data-layout="side"] {
    grid-template-columns: minmax(0, 1fr) auto var(--dock);
    grid-template-rows: minmax(0, 1fr);
  }

  main[data-layout="side"][data-side="left"] {
    grid-template-columns: var(--dock) auto minmax(0, 1fr);
  }

  main[data-layout="side"][data-side="left"] .dock { order: 1; border-right: 1px solid var(--line); border-left: none; }
  main[data-layout="side"][data-side="left"] > .split { order: 2; }
  main[data-layout="side"][data-side="left"] .stage { order: 3; }

  main[data-layout="side"] .dock {
    display: grid;
    border-left: 1px solid var(--line);
  }

  /* Inside the dock the two panes either stack or stand side by side. */
  main[data-layout="side"][data-flow="stack"] .dock { grid-template-rows: minmax(0, auto) auto minmax(0, 1fr); }
  main[data-layout="side"][data-flow="row"] .dock { grid-template-columns: var(--record) auto minmax(0, 1fr); }
  main[data-layout="side"][data-flow="row"] .dock > .split { width: 5px; height: auto; cursor: col-resize; }

  /* Bottom: the dock lies under the graph, its two panes side by side. */
  main[data-layout="bottom"] {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto var(--dock);
  }

  main[data-layout="bottom"] .dock {
    display: grid;
    border-top: 1px solid var(--line);
  }

  main[data-layout="bottom"][data-flow="row"] .dock { grid-template-columns: var(--record) auto minmax(0, 1fr); }
  main[data-layout="bottom"][data-flow="stack"] .dock { grid-template-rows: var(--record) auto minmax(0, 1fr); }
  main[data-layout="bottom"][data-flow="stack"] .dock > .split { height: 5px; width: auto; cursor: row-resize; }

  main[data-order="chat-first"] .record-pane { order: 3; }
  main[data-order="chat-first"] .chat-pane { order: 1; }
  main[data-order="chat-first"] .dock > .split { order: 2; }

  main[data-layout="side"][data-flow="stack"][data-order="chat-first"] .dock { grid-template-rows: minmax(0, 1fr) auto var(--record); }
  main[data-layout="side"][data-flow="row"][data-order="chat-first"] .dock { grid-template-columns: minmax(0, 1fr) auto var(--record); }
  main[data-layout="bottom"][data-flow="row"][data-order="chat-first"] .dock { grid-template-columns: minmax(0, 1fr) auto var(--record); }
  main[data-layout="bottom"][data-flow="stack"][data-order="chat-first"] .dock { grid-template-rows: minmax(0, 1fr) auto var(--record); }

  .dock { min-width: 0; min-height: 0; background: var(--surface); }

  .pane { min-width: 0; min-height: 0; overflow: hidden; display: grid; }

  main[data-flow="row"] .pane { min-width: 14rem; }

  .record-pane {
    align-content: start;
    padding: .8rem 1.25rem;
    overflow-y: auto;
    /* The record takes what it needs, up to a share of the dock; the chat keeps
       the rest instead of holding empty space while the record is clipped. */
    max-height: 60vh;
  }

  main[data-layout="bottom"] .record-pane { max-height: none; }

  .chat-pane {
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: .55rem;
    padding: .8rem 1rem 1rem;
    min-height: 0;
  }

  /* The handle between panels: drag to resize, arrows to nudge. */
  .split { background: var(--line); touch-action: none; }

  main[data-layout="side"] > .split { width: 5px; cursor: col-resize; }
  main[data-layout="side"] .dock > .split { height: 5px; cursor: row-resize; }
  main[data-layout="bottom"] > .split { height: 5px; cursor: row-resize; }
  main[data-layout="bottom"] .dock > .split { width: 5px; cursor: col-resize; }

  .split:hover, .split:focus-visible { background: var(--accent); outline: none; }

  .layout-controls { display: flex; gap: .3rem; }

  .layout-controls button {
    font: inherit;
    font-size: var(--step-0);
    padding: .15rem .5rem;
    color: var(--ink-muted);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    cursor: pointer;
  }

  .layout-controls button:hover, .layout-controls button:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
    outline: none;
  }



  #canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    background:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0 / 28px 28px;
  }

  #canvas.dragging { cursor: grabbing; }

  .edge {
    fill: none;
    stroke: var(--edge-color, var(--line-strong));
    stroke-width: 1.5;
    opacity: .8;
  }
  .edge.rejects, .edge.needs { stroke-dasharray: 4 3; }
  .edge.lit { stroke-width: 2.5; opacity: 1; }

  .node { cursor: pointer; }
  .node .plate {
    fill: var(--surface);
    stroke: var(--line-strong);
    stroke-width: 1;
    rx: 5;
  }
  .node .title { font-size: 13px; fill: var(--ink); }
  .node .kind {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    letter-spacing: .08em;
    fill: var(--ink-muted);
  }
  .node .mark { stroke-width: 1.5; }

  .node[data-kind="aspect"] .plate {
    fill: color-mix(in srgb, var(--aspect-color, var(--accent)) 12%, var(--surface));
    stroke: var(--aspect-color, var(--accent));
    stroke-width: 1.75;
  }
  .node[data-kind="aspect"] .mark {
    fill: var(--aspect-color, var(--accent));
    stroke: var(--aspect-color, var(--accent));
  }
  .node[data-kind="question"] .mark { fill: var(--open-soft); stroke: var(--open); }
  .node[data-kind="decision"] .mark { fill: var(--decided-soft); stroke: var(--decided); }
  .node[data-kind="rejected"] .mark { fill: var(--rejected-soft); stroke: var(--rejected); stroke-dasharray: 3 2; }
  .node[data-kind="module"] .mark { fill: var(--accent-soft); stroke: var(--accent); }
  .node[data-kind="knowledge"] .mark { fill: var(--decided-soft); stroke: var(--decided); }
  .node[data-kind="dependency"] .mark { fill: var(--open-soft); stroke: var(--open); stroke-dasharray: 3 2; }
  .node[data-kind="rejected"] .title { fill: var(--ink-muted); }

  .node:hover .plate { stroke: var(--aspect-color, var(--accent)); stroke-width: 1.5; }

  .hide-btn { cursor: pointer; opacity: 0; }
  .hide-btn circle { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
  .hide-btn line { stroke: var(--ink-muted); stroke-width: 1.4; stroke-linecap: round; }
  .node:hover .hide-btn, .node:focus-within .hide-btn, .hide-btn:focus-visible { opacity: 1; }
  .hide-btn:hover circle { stroke: var(--rejected); }
  .hide-btn:hover line { stroke: var(--rejected); }
  .hide-btn:focus-visible circle { stroke: var(--accent); stroke-width: 2; }

  @media (prefers-reduced-motion: no-preference) {
    .hide-btn { transition: opacity .12s ease-out; }
  }

  .aspect-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .5rem;
    padding: .5rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--surface-sunk);
  }

  .aspect-bar .bar-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: .6875rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-right: .25rem;
  }

  .chip {
    font: inherit;
    font-size: var(--step-0);
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    padding: .15rem .65rem .15rem .5rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--aspect-color, var(--line-strong));
    border-radius: 999px;
    cursor: pointer;
  }

  .chip .dot {
    width: .6rem;
    height: .6rem;
    border-radius: 2px;
    background: var(--aspect-color, var(--line-strong));
  }

  .chip .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: .6875rem;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .chip[aria-pressed="false"] {
    border-style: dashed;
    color: var(--ink-muted);
    background: transparent;
  }

  .chip[aria-pressed="false"] .dot { background: transparent; border: 1px solid var(--aspect-color, var(--line-strong)); }

  .chip:hover { border-style: solid; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .aspect-bar .reset {
    font: inherit;
    font-size: var(--step-0);
    margin-left: auto;
    padding: .15rem .5rem;
    color: var(--ink-muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
  }

  .aspect-bar .reset:hover, .aspect-bar .reset:focus-visible {
    color: var(--accent);
    border-color: var(--line-strong);
    outline: none;
  }

  .aspect-bar .reset[hidden] { display: none; }

  .apply {
    font: inherit;
    font-size: var(--step-0);
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .2rem .75rem;
    color: var(--surface);
    background: var(--decided);
    border: 1px solid var(--decided);
    border-radius: 4px;
    cursor: pointer;
  }

  .apply[disabled] {
    color: var(--ink-muted);
    background: transparent;
    border-color: var(--line-strong);
    cursor: default;
  }

  .apply { flex: none; white-space: nowrap; }
  .apply:not([disabled]):hover { filter: brightness(1.08); }
  .apply:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .answer {
    margin-top: 1.1rem;
    padding-top: .9rem;
    border-top: 1px solid var(--line);
    display: grid;
    gap: .55rem;
  }

  .answer .options { display: flex; flex-wrap: wrap; gap: .35rem; }

  .answer .option {
    font: inherit;
    font-size: var(--step-0);
    padding: .25rem .7rem;
    color: var(--ink);
    background: var(--surface-sunk);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    cursor: pointer;
    text-align: left;
  }

  .answer .option:hover { border-color: var(--accent); color: var(--accent); }
  .answer .option:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .thread { display: grid; gap: .4rem; max-height: 18rem; overflow-y: auto; }

  .thread .msg {
    display: grid;
    gap: .15rem;
    padding: .4rem .6rem;
    font-size: var(--step-0);
    border-radius: 8px;
    max-width: 92%;
  }

  .thread .msg .who {
    font-family: "IBM Plex Mono", monospace;
    font-size: .625rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .thread .msg.you {
    justify-self: end;
    background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }

  .thread .msg.claude {
    justify-self: start;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
  }

  .thread .msg.pending { opacity: .75; border-style: dashed; }

  .compose { display: flex; gap: .4rem; align-items: flex-end; }

  .compose textarea {
    font: inherit;
    font-size: var(--step-0);
    flex: 1;
    min-height: 2.6rem;
    max-height: 9rem;
    field-sizing: content;
    padding: .45rem .55rem;
    color: var(--ink);
    background: var(--surface-sunk);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    resize: vertical;
  }

  .compose textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .compose button {
    font: inherit;
    font-size: var(--step-0);
    padding: .5rem .9rem;
    color: var(--surface);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    cursor: pointer;
  }

  .compose button:hover { filter: brightness(1.08); }
  .compose button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .waiting {
    font-size: var(--step-0);
    color: var(--open);
    display: flex;
    align-items: center;
    gap: .4rem;
  }

  .waiting::before {
    content: "";
    width: .5rem;
    height: .5rem;
    border-radius: 50%;
    background: var(--open);
  }

  /* State lives on a stripe down the left edge, so the plate's own outline is
     free to mean selection and hover alone. */
  .node .state { display: none; width: 3px; }
  .node.answered .state, .node.settled .state, .node.unread .state, .node.fresh .state { display: block; }
  .node.answered .state { fill: var(--open); }
  .node.settled .state { fill: var(--decided); }
  .node.unread .state { fill: var(--accent); }
  .node.fresh .state { fill: var(--aspect-3); }

  .node.settled .mark { fill: var(--decided); stroke: var(--decided); }

  /* A thread Claude has written to, which is not the one on screen. */
  /* A node that has just been built, so its arrival is not silent. */
  @media (prefers-reduced-motion: no-preference) {
    .node.fresh { animation: arrive .5s ease-out; }
    .node.fresh .state { animation: glow 1.8s ease-in-out 3; }
  }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(-8px) scale(.96); }
    to { opacity: 1; }
  }

  @keyframes glow {
    0%, 100% { fill-opacity: 1; }
    50% { fill-opacity: .25; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .node.unread .state { animation: pulse 1.6s ease-in-out infinite; }
  }

  @keyframes pulse {
    0%, 100% { fill-opacity: 1; }
    50% { fill-opacity: .35; }
  }

  .settled {
    font-size: var(--step-0);
    color: var(--decided);
    display: flex;
    align-items: center;
    gap: .4rem;
  }

  .settled::before { content: "✓"; font-weight: 600; }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 1rem;
    transform: translateX(-50%);
    padding: .35rem .8rem;
    font-size: var(--step-0);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    box-shadow: var(--shadow);
  }

  .toast[hidden] { display: none; }

  .qa {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: color-mix(in srgb, var(--ground) 82%, transparent);
    backdrop-filter: blur(3px);
  }

  .qa[hidden] { display: none; }

  .qa-card {
    width: min(38rem, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: 1.75rem;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-top: 3px solid var(--aspect-color, var(--accent));
    border-radius: 6px;
    box-shadow: var(--shadow);
    display: grid;
    gap: .9rem;
  }

  .qa-head {
    display: flex;
    align-items: baseline;
    gap: .75rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: .6875rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .qa-dots { margin-left: auto; display: flex; gap: .25rem; }

  .qa-dots i {
    width: .45rem;
    height: .45rem;
    border-radius: 50%;
    background: var(--line-strong);
  }

  .qa-dots i.done { background: var(--decided); }
  .qa-dots i.here { background: var(--aspect-color, var(--accent)); transform: scale(1.35); }

  .qa-card h2 {
    margin: 0;

<script>
// Design map data. One record per node; `edges` carries the relation that the
// map spec declares, so the same renderer serves an architecture map with a
// different vocabulary.
// Map data. Generated from the sources named in `spec.sources`; every field
// below comes from a source document, never from the renderer.
//
//   title   name of the map, shown in the header and the browser tab
//   source  where the data was taken and when, e.g. "dev/DECISIONS.md · 2026-08-23"
//   spec    kinds — the vocabulary this map uses
//           sources — files the data was read from
//           edge — what an edge means in this map
//   nodes   id, kind, title, body; optional why, cost, status, origin
//           kind drives shape and column: aspect | question | decision | rejected
//           for an architecture map: aspect | dependency | module | knowledge
//   edges   [from, to, relation]; relation "holds" draws solid, "rejects" dashed
const MAP = {
  title: "",
  source: "",
  spec: { nodes: "", sources: [], edge: "" },
  nodes: [],
  edges: []
};

// Both vocabularies a map may speak: design on the left, architecture on the
// right. A kind decides the label, the shape of its marker and its column.
// Stamped when the page is rendered. The server reports the build it is serving
// now; a tab left open across an update reloads itself instead of talking a
// dialect the server no longer speaks.
const BUILD = "dev";

const KIND_LABEL = {
  aspect: "aspect",
  question: "open question",
  decision: "decision",
  rejected: "rejected",
  module: "module",
  knowledge: "knows",
  dependency: "depends on"
};

const KIND_COLUMN = {
  aspect: 0, question: 1, decision: 1, rejected: 2,
  module: 1, knowledge: 2, dependency: 2
};
const NODE_W = 232;
const NODE_H = 52;
const COL_GAP = 96;
const ROW_GAP = 18;

const svg = document.getElementById("canvas");
const panel = document.getElementById("panel");
const byId = new Map(MAP.nodes.map(n => [n.id, n]));


// One hue per aspect. The nodes and edges of an aspect's subtree take its hue,
// so a glance at a line says which aspect it belongs to.
const ASPECT_HUES = 3;
const aspectColour = new Map(
  MAP.nodes.filter(n => n.kind === "aspect")
    .map((aspect, index) => [aspect.id, `var(--aspect-${index % ASPECT_HUES + 1})`])
);

/** Aspect that owns each node; the first aspect reaching it wins. */
function aspectOwners() {
  const children = childrenOf(MAP.edges);
  const owner = new Map();
  const walk = (id, aspect) => {
    if (owner.has(id)) return;
    owner.set(id, aspect);
    for (const child of children.get(id) || []) walk(child, aspect);
  };

  for (const node of MAP.nodes) if (node.kind === "aspect") walk(node.id, node.id);
  return owner;
}

/** Children of every node, in the order the edges declare them. */
function childrenOf(edges) {
  const children = new Map();
  for (const [from, to] of edges) {
    if (!children.has(from)) children.set(from, []);
    children.get(from).push(to);
  }
  return children;
}

/**
 * Assigns a column by kind and stacks each column top to bottom, then lifts
 * every aspect to the vertical centre of the children it owns. Writes x and y
 * onto the nodes and returns the drawing bounds, used to fit the view.
 */
function layout(nodes, edges) {
  const column = KIND_COLUMN;
  const cursor = [0, 0, 0];
  const children = childrenOf(edges);
  const shown = new Set(nodes.map(n => n.id));

  // Walk aspects in order so that an aspect's children sit next to it.
  const placed = new Set();
  const place = id => {
    if (placed.has(id) || !shown.has(id)) return;
    const node = byId.get(id);
    const col = column[node.kind];
    node.x = col * (NODE_W + COL_GAP);
    node.y = cursor[col];
    cursor[col] += NODE_H + ROW_GAP;
    placed.add(id);
    for (const child of children.get(id) || []) place(child);
  };

  for (const node of nodes) if (node.kind === "aspect") place(node.id);
  for (const node of nodes) place(node.id);

  for (const node of nodes) {
    const kids = (children.get(node.id) || []).filter(id => shown.has(id)).map(id => byId.get(id));
    if (node.kind !== "aspect" || kids.length === 0) continue;
    const top = Math.min(...kids.map(k => k.y));
    const bottom = Math.max(...kids.map(k => k.y + NODE_H));
    node.y = (top + bottom) / 2 - NODE_H / 2;
  }

  if (nodes.length === 0) return { minX: 0, minY: 0, maxX: 1, maxY: 1 };

  const xs = nodes.map(n => n.x);
  const ys = nodes.map(n => n.y);
  return {
    minX: Math.min(...xs), minY: Math.min(...ys),
    maxX: Math.max(...xs) + NODE_W, maxY: Math.max(...ys) + NODE_H
  };
}

/**
 * Nodes left after the hidden aspects are dropped. A node survives while any
 * visible aspect still reaches it, so a decision shared by two aspects stays
 * until both are hidden.
 */
function visibleNodes(hidden) {
  const children = childrenOf(MAP.edges);
  const reached = new Set();
  const walk = id => {
    if (reached.has(id)) return;
    reached.add(id);
    for (const child of children.get(id) || []) walk(child);
  };

  for (const node of MAP.nodes) {
    if (node.kind === "aspect" && !hidden.has(node.id)) walk(node.id);
  }

  return MAP.nodes.filter(node => reached.has(node.id));
}

/** Breaks a title into at most two lines of roughly `max` characters. */
function wrap(text, max) {
  const words = text.split(" ");
  const lines = [""];
  for (const word of words) {
    const line = lines[lines.length - 1];
    if (line && (line + " " + word).length > max && lines.length < 2) lines.push(word);
    else lines[lines.length - 1] = line ? line + " " + word : word;
  }
  if (lines[1] && lines[1].length > max) lines[1] = lines[1].slice(0, max - 1) + "…";
  return lines;
}

const NS = "http://www.w3.org/2000/svg";
const el = (name, attrs = {}) => {
  const node = document.createElementNS(NS, name);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
};

/** Marks the node kind by shape: square aspect, diamond question, circle decision. */
function mark(kind) {
  const square = { class: "mark", x: 12, y: NODE_H / 2 - 5, width: 10, height: 10 };

  if (kind === "aspect") return el("rect", { ...square, rx: 1.5 });
  if (kind === "module") return el("rect", { ...square, x: 11, width: 12, height: 8, y: NODE_H / 2 - 4, rx: 1 });
  if (kind === "question" || kind === "dependency") {
    return el("rect", { ...square, transform: `rotate(45 17 ${NODE_H / 2})` });
  }

  return el("circle", { class: "mark", cx: 17, cy: NODE_H / 2, r: 5.5 });
}

const viewport = el("g");
const edgeLayer = el("g");
const nodeLayer = el("g");
viewport.append(edgeLayer, nodeLayer);
svg.append(viewport);

const hidden = new Set();
let bounds = { minX: 0, minY: 0, maxX: 1, maxY: 1 };
let edgeShapes = [];
let nodeShapes = new Map();
let selected = null;
let waiting = null;
let presence = "offline";
let mapStamp = null;
const settled = new Map();
const unread = new Set();

// One conversation for the whole map. Each line carries the node it is about —
// whatever was selected when it was written — so a subject is a label, not a
// separate thread. Lines wait here until Apply and survive a reload through
// localStorage; with the server running they travel as they are written.
const pending = { chat: [] };
const STORE_KEY = "map-chat";

function loadPending() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    if (Array.isArray(raw)) pending.chat.push(...raw);
  } catch (error) {
    // No storage, or a stale value: the page works without either.
  }
}

function savePending() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(pending.chat));
  } catch (error) {
    // Storage can be unavailable; losing the draft beats a broken page.
  }
}

/** Messages the reader has written and not yet applied. */
function pendingCount() {
  return pending.chat.filter(message => message.role === "you" && !message.applied).length;
}

/** The reader's last word about a node — what an answer amounts to. */
function answerOf(id) {
  const mine = pending.chat.filter(message => message.role === "you" && message.about === id);
  return mine.length ? mine[mine.length - 1].text : null;
}

/** The button that drops an aspect and its subtree out of the view. */
function hideButton(node) {
  const button = el("g", {
    class: "hide-btn", transform: `translate(${NODE_W - 16} 16)`,
    tabindex: "0", role: "button", "aria-label": `Hide aspect ${node.title}`
  });
  button.append(el("circle", { r: 8 }));
  button.append(el("line", { x1: -3.2, y1: -3.2, x2: 3.2, y2: 3.2 }));
  button.append(el("line", { x1: -3.2, y1: 3.2, x2: 3.2, y2: -3.2 }));

  const hide = event => {
    event.stopPropagation();
    hidden.add(node.id);
    render();
    fit();
  };

  button.addEventListener("click", hide);
  button.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); hide(event); }
  });
  return button;
}

/** Draws the graph for the aspects that are currently shown. */
function render() {
  edgeLayer.textContent = "";
  nodeLayer.textContent = "";
  nodeShapes = new Map();

  const nodes = visibleNodes(hidden);
  const owner = aspectOwners();
  const colourOf = id => aspectColour.get(owner.get(id)) || "var(--line-strong)";
  const shown = new Set(nodes.map(n => n.id));
  const edges = MAP.edges.filter(([from, to]) => shown.has(from) && shown.has(to));
  bounds = layout(nodes, edges);

  edgeShapes = edges.map(([from, to, relation]) => {
    const a = byId.get(from);
    const b = byId.get(to);
    const x1 = a.x + NODE_W;
    const y1 = a.y + NODE_H / 2;
    const x2 = b.x;
    const y2 = b.y + NODE_H / 2;
    const bend = (x2 - x1) / 2;
    const path = el("path", {
      class: "edge " + relation,
      d: `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`
    });
    path.style.setProperty("--edge-color", colourOf(from));
    edgeLayer.append(path);
    return { path, from, to };
  });

  for (const node of nodes) {
    const group = el("g", {
      class: "node", "data-kind": node.kind, transform: `translate(${node.x} ${node.y})`,
      tabindex: "0", role: "button", "aria-label": `${KIND_LABEL[node.kind]}: ${node.title}`
    });
    group.style.setProperty("--aspect-color", colourOf(node.id));
    group.append(el("rect", { class: "plate", width: NODE_W, height: NODE_H }));
    group.append(el("rect", { class: "state", x: 1, y: 6, height: NODE_H - 12, rx: 1.5 }));
    group.append(mark(node.kind));

    const kindLabel = el("text", { class: "kind", x: 32, y: 18 });
    kindLabel.textContent = KIND_LABEL[node.kind].toUpperCase();
    group.append(kindLabel);

    wrap(node.title, 26).forEach((line, index) => {
      const text = el("text", { class: "title", x: 32, y: 34 + index * 14 });
      text.textContent = line;
      group.append(text);
    });

    if (node.kind === "aspect") group.append(hideButton(node));

    group.addEventListener("click", () => select(node.id));
    group.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(node.id); }
    });

    nodeLayer.append(group);
    nodeShapes.set(node.id, group);
  }

  renderAspectBar();
  renderTally(nodes);
  renderNodeStates();
  updateApply();
  if (selected && nodeShapes.has(selected)) select(selected);
  else if (selected) clearSelection();
}

/**
 * Counts the nodes on the map by status and shows how far the questions have
 * been answered. Hidden aspects drop out of the count with their nodes.
 */
function renderTally(nodes) {
  const tally = document.getElementById("tally");
  tally.textContent = "";

  const total = status => nodes.filter(node => node.status === status).length;
  const open = total("open");
  const decided = total("decided");
  const rejected = total("rejected");
  if (open + decided + rejected === 0) return;

  for (const [status, value] of [["open", open], ["decided", decided], ["rejected", rejected]]) {
    if (value === 0) continue;
    const count = document.createElement("span");
    count.className = "count " + status;
    const number = document.createElement("b");
    number.textContent = value;
    count.append(number, document.createTextNode(status));
    tally.append(count);
  }

  if (open + decided === 0) return;
  const progress = document.createElement("span");
  progress.className = "progress";
  progress.title = `${decided} of ${open + decided} answered`;
  const fill = document.createElement("i");
  fill.style.width = Math.round(decided / (open + decided) * 100) + "%";
  progress.append(fill);
  tally.append(progress);
}

/** One chip per aspect: pressed means the aspect is on the map. */
function renderAspectBar() {
  const bar = document.getElementById("aspectBar");
  bar.textContent = "";

  const label = document.createElement("span");
  label.className = "bar-label";
  label.textContent = "Aspects";
  bar.append(label);

  const owner = aspectOwners();
  for (const aspect of MAP.nodes.filter(n => n.kind === "aspect")) {
    const shown = !hidden.has(aspect.id);
    const size = MAP.nodes.filter(n => owner.get(n.id) === aspect.id && n.id !== aspect.id).length;

    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.setAttribute("aria-pressed", String(shown));
    chip.style.setProperty("--aspect-color", aspectColour.get(aspect.id));

    const dot = document.createElement("span");
    dot.className = "dot";
    const name = document.createElement("span");
    name.textContent = aspect.title;
    const count = document.createElement("span");
    count.className = "count";
    const openHere = MAP.nodes.filter(n => owner.get(n.id) === aspect.id && n.status === "open").length;
    count.textContent = openHere ? `${openHere}?/${size}` : size;
    count.title = openHere ? `${openHere} open of ${size} nodes` : `${size} nodes`;
    chip.append(dot, name, count);

    chip.addEventListener("click", () => {
      if (shown) hidden.add(aspect.id);
      else hidden.delete(aspect.id);
      render();
      fit();
    });

    bar.append(chip);
  }

  const controls = document.createElement("span");
  controls.className = "layout-controls";
  controls.style.marginLeft = "auto";

  const toggle = (title, label, change) => {
    const button = document.createElement("button");
    button.type = "button";
    button.title = title;
    button.textContent = label;
    button.addEventListener("click", () => {
      change();
      saveLayout();
      renderAspectBar();
      fit();
    });
    return button;
  };

  controls.append(
    toggle("Panels beside the graph, or under it", main.dataset.layout === "side" ? "▤ side" : "▥ bottom",
      () => { main.dataset.layout = main.dataset.layout === "side" ? "bottom" : "side"; }),
    toggle("Which edge the panels sit against", main.dataset.side === "left" ? "⇤ left" : "⇥ right",
      () => { main.dataset.side = main.dataset.side === "left" ? "right" : "left"; }),
    toggle("Record and conversation: side by side, or one above the other",
      main.dataset.flow === "row" ? "◫ side by side" : "▤ stacked",
      () => { main.dataset.flow = main.dataset.flow === "row" ? "stack" : "row"; }),
    toggle("Swap the record and the conversation", "⇄",
      () => { main.dataset.order = main.dataset.order === "chat-first" ? "record-first" : "chat-first"; })
  );
  bar.append(controls);

  const qa = document.createElement("button");
  qa.type = "button";
  qa.className = "mode-toggle";
  qa.textContent = "One question at a time";
  qa.addEventListener("click", () => openQA());
  bar.append(qa);

  const apply = document.createElement("button");
  apply.type = "button";
  apply.className = "apply";
  apply.id = "applyButton";
  apply.addEventListener("click", applyPending);
  bar.append(apply);

  const reset = document.createElement("button");
  reset.type = "button";
  reset.className = "reset";
  reset.style.marginLeft = "0";
  reset.textContent = "Show all";
  reset.hidden = hidden.size === 0;
  reset.addEventListener("click", () => {
    hidden.clear();
    render();
    fit();
  });
  bar.append(reset);
}

/** Opens a node in the panel and dims everything it is not connected to. */
function select(id) {
  selected = id;
  const lit = new Set([id]);
  for (const { from, to } of edgeShapes) {
    if (from === id) lit.add(to);
    if (to === id) lit.add(from);
  }

  svg.classList.add("has-selection");
  for (const [nodeId, group] of nodeShapes) {
    group.classList.toggle("lit", lit.has(nodeId));
    group.classList.toggle("selected", nodeId === id);
  }
  for (const { path, from, to } of edgeShapes) {
    path.classList.toggle("lit", from === id || to === id);
  }

  renderPanel(byId.get(id), [...lit].filter(other => other !== id));
  renderChatSubject();
  panel.hidden = false;
  panel.style.setProperty("--aspect-color", aspectColour.get(aspectOwners().get(id)) || "var(--accent)");
  unread.delete(id);
  if (nodeShapes.has(id)) nodeShapes.get(id).classList.remove("unread");
  bringIntoView(byId.get(id));
  window.mapBridge?.select(id);
}

function clearSelection() {
  selected = null;
  renderChatSubject();
  panel.hidden = true;
  svg.classList.remove("has-selection");
  for (const group of nodeShapes.values()) group.classList.remove("lit", "selected");
  for (const { path } of edgeShapes) path.classList.remove("lit");
  renderSpec();
}

function renderSpec() {
  panel.innerHTML = "";
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "Pick a node to read the full record. Neighbours stay lit; everything else dims.";
  panel.append(hint);

  const spec = document.createElement("div");
  spec.className = "spec";
  const rows = [
    ["Nodes", MAP.spec.nodes],
    ["Edge means", MAP.spec.edge]
  ];
  for (const [label, value] of rows) {
    const row = document.createElement("div");
    const dt = document.createElement("span");
    dt.className = "panel-kind";
    dt.textContent = label;
    const dd = document.createElement("span");
    dd.textContent = value;
    row.append(dt, dd);
    spec.append(row);
  }

  const sources = document.createElement("div");
  const label = document.createElement("span");
  label.className = "panel-kind";
  label.textContent = "Reads";
  sources.append(label);
  for (const source of MAP.spec.sources) {
    const code = document.createElement("code");
    code.textContent = source;
    sources.append(code);
  }
  spec.append(sources);
  panel.append(spec);
}

function renderPanel(node, neighbours) {
  panel.innerHTML = "";

  const close = document.createElement("button");
  close.type = "button";
  close.className = "record-close";
  close.textContent = "✕";
  close.title = "Close the record";
  close.addEventListener("click", clearSelection);
  panel.append(close);

  const kind = document.createElement("div");
  kind.className = "panel-kind";
  kind.textContent = KIND_LABEL[node.kind];
  panel.append(kind);

  const title = document.createElement("h2");
  title.textContent = node.title;
  panel.append(title);

  if (node.status) {
    const status = document.createElement("span");
    status.className = "status " + node.status;
    status.textContent = node.status;
    panel.append(status);
  }

  const list = document.createElement("dl");
  const rows = [
    ["What", node.body],
    ["Why", node.why],
    ["Price", node.cost]
  ].filter(([, value]) => value);

  for (const [label, value] of rows) {
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    list.append(dt, dd);
  }

  if (neighbours.length) {
    const dt = document.createElement("dt");
    dt.textContent = "Connected";
    const dd = document.createElement("dd");
    dd.className = "links";
    for (const id of neighbours) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = byId.get(id).title;
      button.addEventListener("click", () => select(id));
      dd.append(button);
    }
    list.append(dt, dd);
  }

  panel.append(list);

  if (node.refs && node.refs.length) {
    const dt = document.createElement("dt");
    dt.textContent = "Files";
    const dd = document.createElement("dd");
    dd.className = "refs";
    for (const ref of node.refs) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = ref.lines ? `${ref.file}:${ref.lines}` : ref.file;
      button.disabled = !ref.code;
      button.title = ref.code ? "Open the fragment" : "No fragment stored for this file";
      button.addEventListener("click", () => openCode(ref));
      dd.append(button);
    }

    list.append(dt, dd);
  }

  if (node.origin) {
    const origin = document.createElement("p");
    origin.className = "origin";
    origin.textContent = node.origin;
    panel.append(origin);
  }
}

/**
 * Draws the whole conversation. One log, one field: the selected node is the
 * subject of what is written next, and a line names the subject it had.
 */
function renderChat() {
  const log = document.getElementById("chatLog");
  const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
  log.textContent = "";

  let lastSubject = null;
  for (const message of pending.chat) {
    if (message.about !== lastSubject && message.about && byId.has(message.about)) {
      const subject = document.createElement("button");
      subject.type = "button";
      subject.className = "subject-line";
      subject.textContent = "— " + byId.get(message.about).title + " —";
      subject.addEventListener("click", () => select(message.about));
      log.append(subject);
    }

    lastSubject = message.about;

    const line = document.createElement("div");
    line.className = "msg " + message.role
      + (message.role === "you" && !message.applied ? " pending" : "")
      + (message.undelivered ? " undelivered" : "");
    line.textContent = message.text;
    if (message.undelivered) line.title = "Not delivered yet";
    log.append(line);
  }

  renderTyping();
  if (atEnd) requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  renderChatSubject();
}

/**
 * A bubble at the end of the log while Claude is working: an answer is coming,
 * and the log says so where the answer will appear.
 */
function renderTyping() {
  const log = document.getElementById("chatLog");
  const existing = log.querySelector(".typing");
  const show = presence === "working";

  if (!show) {
    if (existing) existing.remove();
    return;
  }

  if (existing) {
    log.append(existing);
    return;
  }

  const bubble = document.createElement("div");
  bubble.className = "msg claude typing";
  bubble.innerHTML = "<i></i><i></i><i></i>";
  log.append(bubble);
  log.scrollTop = log.scrollHeight;
}

const PRESENCE_WORDS = {
  waiting: ["waiting", "Claude is waiting for your next message"],
  working: ["working", "Claude is on the map, doing something else right now"],
  offline: ["away", "Nobody is on the map; a message will wait"]
};

/** The dot and the word: what Claude is doing, in one glance. */
function renderPresence() {
  const box = document.getElementById("presence");
  const state = waiting ? "waiting" : presence;
  const [word, hint] = PRESENCE_WORDS[state] || PRESENCE_WORDS.offline;

  box.dataset.state = state;
  box.title = waiting && waiting.note ? `${hint} — ${waiting.note}` : hint;
  box.querySelector("b").textContent = word;
}

/** The subject line and the shortcuts a question offers. */
function renderChatSubject() {
  const about = document.getElementById("chatAbout");
  const options = document.getElementById("chatOptions");
  const node = selected ? byId.get(selected) : null;

  about.textContent = "";
  if (node) {
    const label = document.createElement("button");
    label.type = "button";
    label.textContent = node.title;
    label.title = "Show this node";
    label.addEventListener("click", () => select(node.id));
    about.append(document.createTextNode("about "), label);
  } else {
    about.textContent = "about the map — pick a node to change the subject";
  }

  renderPresence();

  options.textContent = "";
  for (const option of (node && node.options) || []) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = option;
    button.addEventListener("click", () => say(option));
    options.append(button);
  }
}

/** Adds one message from the reader and lets the server know, if it is there. */
function say(text, about = selected) {
  const message = { role: "you", text, about, at: new Date().toISOString() };
  pending.chat.push(message);
  commitPending();
  renderChat();
  deliver(message);
}

/**
 * Hands one line to the server, and remembers if it did not arrive: a line the
 * server never saw would otherwise sit in the log looking sent while Claude
 * waits for something that never comes.
 */
function deliver(message) {
  if (!window.mapBridge) return;

  window.mapBridge.message(message.text, message.about).then(() => {
    delete message.undelivered;
    savePending();
    renderChat();
  }).catch(() => {
    message.undelivered = true;
    savePending();
    renderChat();
    toast("Not delivered — will try again");
  });
}

/** Sends again whatever never reached the server. */
function resend() {
  if (!window.mapBridge) return;
  for (const message of pending.chat) {
    if (message.role === "you" && message.undelivered && !message.id) deliver(message);
  }
}

/**
 * The walkthrough's own field. It writes into the same conversation as the chat
 * column — one log, whichever card the words were typed on.
 */
function questionForm(node) {
  const box = document.createElement("div");
  box.className = "answer";

  if (node.options && node.options.length) {
    const options = document.createElement("div");
    options.className = "options";
    for (const option of node.options) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";
      button.textContent = option;
      button.addEventListener("click", () => { say(option, node.id); renderQA(); });
      options.append(button);
    }

    box.append(options);
  }

  const said = pending.chat.filter(message => message.about === node.id);
  if (said.length) {
    const log = document.createElement("div");
    log.className = "chat-log";
    for (const message of said) {
      const line = document.createElement("div");
      line.className = "msg " + message.role;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = message.role === "you" ? "you" : "claude";
      const text = document.createElement("span");
      text.textContent = message.text;
      line.append(who, text);
      log.append(line);
    }

    box.append(log);
  }

  const compose = document.createElement("div");
  compose.className = "compose";
  const field = document.createElement("textarea");
  field.rows = 2;
  field.placeholder = "Enter sends, Shift+Enter breaks the line";
  field.addEventListener("keydown", event => {
    if (event.key !== "Enter" || event.shiftKey) return;
    event.preventDefault();
    const text = field.value.trim();
    if (text) { say(text, node.id); renderQA(); }
  });

  const send = document.createElement("button");
  send.type = "button";
  send.textContent = "Send";
  send.addEventListener("click", () => {
    const text = field.value.trim();
    if (text) { say(text, node.id); renderQA(); }
  });

  compose.append(field, send);
  box.append(compose);
  return box;
}

/**
 * Takes the map's data again after it changed on disk and grows the graph in
 * place: new nodes arrive with a mark on them, so it is visible that they were
 * just built rather than always there.
 */
async function growMap() {
  const name = location.pathname.split("/").pop();

  let next;
  try {
    next = await fetch(`/api/map/${name}`).then(response => response.ok ? response.json() : null);
  } catch (error) {
    return false;
  }

  if (!next || !Array.isArray(next.nodes)) return false;

  // Compare what the map says, not where the layout happened to put it: x and
  // y are written onto every node on each render.
  const meaning = node => JSON.stringify([
    node.kind, node.title, node.body, node.why, node.cost, node.status, node.options, node.refs
  ]);

  const before = new Map(MAP.nodes.map(node => [node.id, meaning(node)]));
  const arrived = next.nodes.filter(node => !before.has(node.id));
  const changed = next.nodes.filter(node =>
    before.has(node.id) && before.get(node.id) !== meaning(node));
  const gone = [...before.keys()].filter(id => !next.nodes.some(node => node.id === id));

  MAP.nodes = next.nodes;
  MAP.edges = next.edges;
  MAP.spec = next.spec || MAP.spec;
  byId.clear();
  for (const node of MAP.nodes) byId.set(node.id, node);

  const view = { scale, offsetX, offsetY };
  render();

  if (moved) {
    scale = view.scale;
    offsetX = view.offsetX;
    offsetY = view.offsetY;
    applyTransform();
  } else {
    fit();
  }

  for (const node of [...arrived, ...changed]) markFresh(node.id);

  const said = [];
  if (arrived.length) said.push(`new: ${arrived.map(node => node.title).join(", ")}`);
  if (changed.length) said.push(`changed: ${changed.map(node => node.title).join(", ")}`);
  if (gone.length) said.push(`removed: ${gone.length}`);
  if (said.length) toast(said.join(" · "));

  // Never move the reader's subject out from under them while they are writing.
  const typing = document.getElementById("chatField").value.trim().length > 0;
  if (arrived.length && !typing) select(arrived[arrived.length - 1].id);
  else if (selected && byId.has(selected)) select(selected);
  else if (selected) clearSelection();

  return true;
}

/** Redraws what shows the conversation, so it stays current. */
function refreshBlock() {
  renderChat();
  if (!document.getElementById("qa").hidden) renderQA();
}

/** Saves the draft and refreshes everything that shows how much is waiting. */
function commitPending() {
  savePending();
  updateApply();
  renderNodeStates();
  renderTally(visibleNodes(hidden));
}

/**
 * Nodes built or changed in the last few seconds. Kept as state rather than a
 * class on the element: the graph is redrawn whenever the map grows, and a
 * class set on the old element would vanish with it.
 */
const fresh = new Map();
const FRESH_FOR = 8000;

function markFresh(id) {
  fresh.set(id, Date.now());
  renderNodeStates();
  setTimeout(() => {
    if (Date.now() - (fresh.get(id) || 0) >= FRESH_FOR - 50) {
      fresh.delete(id);
      renderNodeStates();
    }
  }, FRESH_FOR);
}

/** Marks the nodes that already carry an answer. */
function renderNodeStates() {
  for (const [id, group] of nodeShapes) {
    group.classList.toggle("answered", answerOf(id) !== null);
    group.classList.toggle("settled", settled.has(id));
    group.classList.toggle("unread", unread.has(id));
    group.classList.toggle("fresh", fresh.has(id));
  }
}

function updateApply() {
  const button = document.getElementById("applyButton");
  if (!button) return;
  // This button ends the round: until it is pressed the work goes on.
  const count = pendingCount();
  const label = count ? `Finish · ${count} to hand over` : "Finish";
  button.disabled = false;
  // Rewriting the same text on every poll made the button flicker.
  if (button.textContent !== label) button.textContent = label;
  button.title = "Hand the conversation over and end the round";
}

/**
 * Hands the draft over. With the map plugin running, `window.mapBridge` takes
 * it and the session picks it up; without it, the summary goes to the clipboard
 * and the reader pastes it into the conversation.
 */
async function applyPending() {

  const lines = [`# ${MAP.title}`];
  for (const message of pending.chat) {
    const about = message.about && byId.has(message.about) ? ` (${byId.get(message.about).title})` : "";
    lines.push(`- ${message.role}${about}: ${message.text}`);
  }

  const summary = lines.join("\n");
  const payload = {
    map: MAP.title,
    chat: pending.chat.map(({ role, text, about }) => ({ role, text, about })),
    answers: lastWordPerNode(),
    summary
  };

  if (window.mapBridge && typeof window.mapBridge.apply === "function") {
    await window.mapBridge.apply(payload);
    toast("Sent to Claude");
  } else {
    try {
      await navigator.clipboard.writeText(summary);
      toast("Copied — paste it into the conversation");
    } catch (error) {
      toast("Copy failed; the text is in the console");
      console.log(summary);
    }
  }

  for (const message of pending.chat) message.applied = true;
  commitPending();
  renderChat();
}

/** The reader's last word about each node, next to the conversation itself. */
function lastWordPerNode() {
  const answers = {};
  for (const message of pending.chat) {
    if (message.role === "you" && message.about) answers[message.about] = message.text;
  }

  return answers;
}

let toastTimer = null;

function toast(text) {
  const box = document.getElementById("toast");
  box.textContent = text;
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, 2600);
}

/**
 * Opens one source fragment. The code travels inside the map: it is copied out
 * of the file when the map is rendered, so the page shows what the map was built
 * from even when the file has moved on. Colouring comes with it as `ref.html`
 * when the plugin server rendered the page; a static build shows plain text.
 */
function openCode(ref) {
  const box = document.getElementById("codeWindow");
  box.textContent = "";
  box.hidden = false;

  const card = document.createElement("div");
  card.className = "code-card";

  const head = document.createElement("div");
  head.className = "code-head";
  const path = document.createElement("span");
  path.className = "path";
  path.textContent = ref.file;
  const lines = document.createElement("span");
  lines.className = "lines";
  lines.textContent = ref.lines ? `:${ref.lines}` : "";
  const spacer = document.createElement("span");
  spacer.className = "spacer";

  const copy = document.createElement("button");
  copy.type = "button";
  copy.textContent = "Copy path";
  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(ref.lines ? `${ref.file}:${ref.lines}` : ref.file);
      toast("Path copied");
    } catch (error) {
      toast("Copy failed");
    }
  });

  const close = document.createElement("button");
  close.type = "button";
  close.textContent = "Close";
  close.addEventListener("click", closeCode);

  head.append(path, lines, spacer, copy, close);
  card.append(head);

  const body = document.createElement("pre");
  body.className = "code-body";
  const first = parseInt(String(ref.lines || "1").split("-")[0], 10) || 1;

  const coloured = Array.isArray(ref.html) ? ref.html : null;
  (ref.code || "").split("\n").forEach((line, index) => {
    const row = document.createElement("div");
    row.className = "row";
    const number = document.createElement("span");
    number.className = "ln";
    number.textContent = first + index;
    const code = document.createElement("code");
    if (coloured && coloured[index] !== undefined) code.innerHTML = coloured[index];
    else code.textContent = line;
    row.append(number, code);
    body.append(row);
  });

  card.append(body);
  box.append(card);
  close.focus();
}

function closeCode() {
  document.getElementById("codeWindow").hidden = true;
}

// One question at a time: the same answering, shown one card at a time so the
// reader is not asked to hold five open questions in their head at once.
let qaIndex = 0;
let qaNode = null;

function openQuestions() {
  return visibleNodes(hidden)
    .filter(node => node.kind === "question" && node.status === "open" && !settled.has(node.id));
}

function openQA(index = 0) {
  qaIndex = index;
  qaNode = null;
  document.getElementById("qa").hidden = false;
  renderQA();
}

function closeQA() {
  document.getElementById("qa").hidden = true;
  if (selected) select(selected);
}

function renderQA() {
  const box = document.getElementById("qa");
  // Keep what is half-written and where the caret sits: this redraws on every
  // reply that arrives, and losing a sentence mid-word is unforgivable.
  const old = box.querySelector("textarea");
  const draft = old ? old.value : "";
  const hadFocus = old && document.activeElement === old;
  const caret = old ? old.selectionStart : 0;

  box.textContent = "";

  const questions = openQuestions();
  const card = document.createElement("div");
  card.className = "qa-card";

  if (questions.length === 0) {
    card.classList.add("qa-empty");
    const text = document.createElement("p");
    text.textContent = "No open questions on the map.";
    const back = document.createElement("button");
    back.type = "button";
    back.className = "ghost";
    back.textContent = "Back to the map";
    back.addEventListener("click", closeQA);
    card.append(text, back);
    box.append(card);
    return;
  }

  // Follow the question itself: settling another one shortens the list, and an
  // index would then point at a different card than the reader was answering.
  if (qaNode) {
    const stillThere = questions.findIndex(question => question.id === qaNode);
    if (stillThere >= 0) qaIndex = stillThere;
  }

  qaIndex = Math.max(0, Math.min(qaIndex, questions.length - 1));
  const node = questions[qaIndex];
  qaNode = node.id;
  const owner = aspectOwners();
  card.style.setProperty("--aspect-color", aspectColour.get(owner.get(node.id)) || "var(--accent)");

  const head = document.createElement("div");
  head.className = "qa-head";
  const where = document.createElement("span");
  where.textContent = byId.get(owner.get(node.id))?.title || "question";
  const position = document.createElement("span");
  position.textContent = `${qaIndex + 1} of ${questions.length}`;
  const dots = document.createElement("span");
  dots.className = "qa-dots";
  questions.forEach((question, index) => {
    const dot = document.createElement("i");
    if (answerOf(question.id) !== null) dot.classList.add("done");
    if (index === qaIndex) dot.classList.add("here");
    dots.append(dot);
  });
  head.append(where, position, dots);
  card.append(head);

  const title = document.createElement("h2");
  title.textContent = node.title;
  card.append(title);

  if (node.body) {
    const body = document.createElement("p");
    body.className = "body";
    body.textContent = node.body;
    card.append(body);
  }

  if (node.why) {
    const why = document.createElement("p");
    why.className = "why";
    why.textContent = node.why;
    card.append(why);
  }

  card.append(questionForm(node));

  const actions = document.createElement("div");
  actions.className = "qa-actions";

  const back = document.createElement("button");
  back.type = "button";
  back.className = "ghost";
  back.textContent = "← Previous";
  back.disabled = qaIndex === 0;
  back.addEventListener("click", () => { qaIndex -= 1; renderQA(); });

  const next = document.createElement("button");
  next.type = "button";
  next.className = "ghost";
  next.textContent = qaIndex === questions.length - 1 ? "Done" : "Next →";
  next.addEventListener("click", () => {
    if (qaIndex === questions.length - 1) closeQA();
    else { qaIndex += 1; renderQA(); }
  });

  const toMap = document.createElement("button");
  toMap.type = "button";
  toMap.className = "ghost grow";
  toMap.textContent = "Show on the map";
  toMap.addEventListener("click", () => { closeQA(); select(node.id); });

  actions.append(back, next, toMap);
  card.append(actions);
  box.append(card);

  const field = box.querySelector("textarea");
  if (field && draft) {
    field.value = draft;
    if (hadFocus) {
      field.focus();
      field.setSelectionRange(caret, caret);
    }
  }
}

/**
 * On a phone the record slides up over the graph and leaves a band at the top;
 * the chosen node is moved into that band, or it would sit behind the sheet.
 * On a wide screen the panel takes its own column and nothing has to move.
 */
function bringIntoView(node) {
  const rect = svg.getBoundingClientRect();
  if (rect.width >= 640 || !node) return;

  const band = rect.height * 0.34;
  offsetX = rect.width / 2 - (node.x + NODE_W / 2) * scale;
  offsetY = band / 2 - (node.y + NODE_H / 2) * scale;
  applyTransform();
}

// View transform: wheel zooms around the pointer, drag pans, Fit frames the graph.
let scale = 1;
let offsetX = 0;
let offsetY = 0;

function applyTransform() {
  viewport.setAttribute("transform", `translate(${offsetX} ${offsetY}) scale(${scale})`);
}

function fit() {
  const rect = svg.getBoundingClientRect();
  const width = bounds.maxX - bounds.minX;
  const height = bounds.maxY - bounds.minY;
  const padding = rect.width < 640 ? 20 : 48;
  const fitted = Math.min((rect.width - padding * 2) / width, (rect.height - padding * 2) / height, 1.3);
  // On a phone the whole graph would shrink past reading size, so the fit stops
  // at a legible scale and the rest of the map is reached by dragging.
  scale = rect.width < 640 ? Math.max(fitted, 0.62) : fitted;
  offsetX = (rect.width - width * scale) / 2 - bounds.minX * scale;
  offsetY = (rect.height - height * scale) / 2 - bounds.minY * scale;
  applyTransform();
}

svg.addEventListener("wheel", event => {
  event.preventDefault();
  const rect = svg.getBoundingClientRect();
  const px = event.clientX - rect.left;
  const py = event.clientY - rect.top;
  moved = true;
  const factor = Math.exp(-event.deltaY * 0.0015);
  const next = Math.min(2.5, Math.max(0.3, scale * factor));
  offsetX = px - (px - offsetX) * (next / scale);
  offsetY = py - (py - offsetY) * (next / scale);
  scale = next;
  applyTransform();
}, { passive: false });

let dragging = null;
// Whether the reader has moved the view themselves; if they have, a map that
// grows must not yank it back to the overview.
let moved = false;
const touches = new Map();
let pinch = null;

const spread = () => {
  const [a, b] = [...touches.values()];
  return { distance: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
};

svg.addEventListener("pointerdown", event => {
  touches.set(event.pointerId, { x: event.clientX, y: event.clientY });

  if (touches.size === 2) {
    // Two fingers: pinch. The pan started by the first finger is dropped, or
    // the map would slide while the pinch scales it.
    dragging = null;
    const start = spread();
    pinch = { distance: start.distance, scale, x: start.x, y: start.y, offsetX, offsetY };
    return;
  }

  if (event.target.closest(".node")) return;
  dragging = { x: event.clientX - offsetX, y: event.clientY - offsetY };
  svg.setPointerCapture(event.pointerId);
  svg.classList.add("dragging");
});

svg.addEventListener("pointermove", event => {
  if (touches.has(event.pointerId)) touches.set(event.pointerId, { x: event.clientX, y: event.clientY });

  if (pinch && touches.size === 2) {
    const now = spread();
    const rect = svg.getBoundingClientRect();
    const next = Math.min(2.5, Math.max(0.3, pinch.scale * (now.distance / pinch.distance)));
    const px = pinch.x - rect.left;
    const py = pinch.y - rect.top;
    offsetX = px - (px - pinch.offsetX) * (next / pinch.scale);
    offsetY = py - (py - pinch.offsetY) * (next / pinch.scale);
    scale = next;
    applyTransform();
    return;
  }

  if (!dragging) return;
  moved = true;
  offsetX = event.clientX - dragging.x;
  offsetY = event.clientY - dragging.y;
  applyTransform();
});

const endDrag = event => {
  if (event) touches.delete(event.pointerId);
  if (touches.size < 2) pinch = null;
  dragging = null;
  svg.classList.remove("dragging");
};

svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);

svg.addEventListener("click", event => {
  if (!event.target.closest(".node") && selected) clearSelection();
});

document.addEventListener("keydown", event => {
  const inField = event.target instanceof HTMLElement && ["TEXTAREA", "INPUT"].includes(event.target.tagName);
  if (event.key === "Escape") {
    if (!document.getElementById("codeWindow").hidden) closeCode();
    else if (!document.getElementById("qa").hidden) closeQA();
    else if (selected) clearSelection();
    return;
  }

  if (inField) return;
  if (event.key === "q") openQA();
});

document.getElementById("fit").addEventListener("click", () => { moved = false; fit(); });
document.getElementById("clear").addEventListener("click", clearSelection);
window.addEventListener("resize", fit);

// The plugin server is the only thing that serves this page over http, so its
// presence is the signal that a session is listening. Opened as a file, or as a
// published artifact, the page keeps everything to itself.
if (location.protocol === "http:" || location.protocol === "https:") {
  const post = (path, payload) => fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(response => response.json());

  window.mapBridge = {
    apply: payload => post("/api/apply", payload),
    select: id => post("/api/selection", { map: MAP.title, node: id }).catch(() => {}),
    message: (text, about) => post("/api/message", { map: MAP.title, text, about })
  };

  // Claude points at one question and replies in its thread; the page asks for
  // both on a timer, opens the question it is asked about, and shows the reply.
  let asked = null;
  let ticking = false;
  setInterval(async () => {
    if (ticking) return;
    ticking = true;
    try {
      const news = await fetch("/api/updates").then(response => response.json());

      // The map's own data changed — a node was added or settled while we
      // watched — so the graph on screen is out of date.
      if (mapStamp === null) mapStamp = news.map || "";
      else if (news.map && news.map !== mapStamp) {
        // Only accept the new stamp once the map actually came down; a failed
        // fetch must be retried on the next tick, not forgotten.
        if (await growMap()) mapStamp = news.map;
      }

      if (news.build && BUILD !== "dev" && news.build !== BUILD) {
        toast("The map changed — reloading");
        setTimeout(() => location.reload(), 1200);
        return;
      }

      // Match by id, not by count: the page keeps its own history and the
      // server starts a fresh one, so counting made a new reply look old.
      // The server holds the conversation both sides can see; take whatever is
      // not here yet, matching by id and falling back to time plus text for
      // lines saved before ids existed.
      const key = message => message.id || `${message.at}|${message.text}`;
      const known = new Set(pending.chat.flatMap(message =>
        [message.id, `${message.at}|${message.text}`].filter(Boolean)));
      const fresh = (news.chat || []).filter(message => !known.has(key(message)));

      if (fresh.length) {
        for (const message of fresh) {
          // Our own line comes back with an id it did not have when it was
          // written here; adopt the id instead of adding the line twice.
          const mine = message.role === "you" && pending.chat.find(local =>
            !local.id && local.role === "you" && local.text === message.text && local.about === message.about);

          if (mine) {
            mine.id = message.id;
            mine.at = message.at;
            continue;
          }

          pending.chat.push({
            id: message.id, role: message.role, text: message.text,
            about: message.about, at: message.at, applied: message.role === "you" ? undefined : true
          });
        }

        pending.chat.sort((a, b) => String(a.at).localeCompare(String(b.at)));
        savePending();
        renderChat();

        const last = fresh[fresh.length - 1];
        if (last.role === "claude" && last.about && byId.has(last.about) && selected !== last.about) {
          select(last.about);
        }
      }

      resend();
      presence = news.presence || "offline";
      renderPresence();
      renderTyping();

      for (const [id, mark] of Object.entries(news.resolved || {})) {
        if (settled.has(id)) continue;
        settled.set(id, mark);
        if (nodeShapes.has(id)) nodeShapes.get(id).classList.add("settled");
        refreshBlock();
      }

      waiting = news.focus || null;
      const node = waiting && waiting.node;
      if (node === asked) return;
      asked = node;
      if (!node || !byId.has(node)) return;
      hidden.clear();
      render();
      select(node);
      toast(waiting.note || "Claude is waiting for this answer");
    } catch (error) {
      // The server went away; the page keeps working on its own.
    } finally {
      ticking = false;
    }
  }, 1500);
}

// Layout: where the dock sits, which pane comes first, and how big each is.
// All of it is per-viewer taste, so it lives in this browser and nowhere else.
const LAYOUT_KEY = "map-layout";
const main = document.getElementById("main");

function loadLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}");
    if (saved.layout) main.dataset.layout = saved.layout;
    if (saved.side) main.dataset.side = saved.side;
    if (saved.flow) main.dataset.flow = saved.flow;
    if (saved.order) main.dataset.order = saved.order;
    if (saved.dock) main.style.setProperty("--dock", saved.dock);
    if (saved.record) main.style.setProperty("--record", saved.record);
  } catch (error) {
    // Nothing saved, or storage is unavailable: the defaults stand.
  }
}

function saveLayout() {
  try {
    localStorage.setItem(LAYOUT_KEY, JSON.stringify({
      layout: main.dataset.layout,
      side: main.dataset.side,
      flow: main.dataset.flow,
      order: main.dataset.order,
      dock: main.style.getPropertyValue("--dock").trim() || undefined,
      record: main.style.getPropertyValue("--record").trim() || undefined
    }));
  } catch (error) {
    // A layout that is not remembered still works.
  }
}

/**
 * Drags one handle. `variable` is the size it changes; which screen axis that
 * is depends on the orientation, so it is read at the start of each drag.
 */
function draggable(handle, variable, invert) {
  // Which screen axis a handle moves along depends on where the dock sits and
  // whether its panes are stacked, so it is worked out at every drag.
  const axis = () => {
    if (variable === "--dock") return main.dataset.layout === "side" ? "x" : "y";
    return main.dataset.flow === "row" ? "x" : "y";
  };

  handle.addEventListener("pointerdown", event => {
    event.preventDefault();
    handle.setPointerCapture(event.pointerId);
    const box = main.getBoundingClientRect();
    const startSize = parseFloat(getComputedStyle(main).getPropertyValue(variable));
    const start = axis() === "x" ? event.clientX : event.clientY;
    const flip = invert() ? -1 : 1;

    const move = moveEvent => {
      const now = axis() === "x" ? moveEvent.clientX : moveEvent.clientY;
      const limit = axis() === "x" ? box.width : box.height;
      const next = Math.min(Math.max(startSize + (start - now) * flip, 160), limit - 160);
      main.style.setProperty(variable, `${Math.round(next)}px`);
      applyTransform();
    };

    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      saveLayout();
      fit();
    };

    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
  });
}

draggable(document.getElementById("splitMain"), "--dock", () => main.dataset.side === "left" && main.dataset.layout === "side");
draggable(document.getElementById("splitDock"), "--record", () => main.dataset.order === "chat-first");

loadLayout();

const chatField = document.getElementById("chatField");
chatField.addEventListener("keydown", event => {
  if (event.key !== "Enter" || event.shiftKey) return;
  event.preventDefault();
  const text = chatField.value.trim();
  if (!text) return;
  chatField.value = "";
  say(text);
});

document.getElementById("chatSend").addEventListener("click", () => {
  const text = chatField.value.trim();
  if (!text) return;
  chatField.value = "";
  say(text);
});

loadPending();
document.title = MAP.title || "Map";
document.getElementById("mapTitle").textContent = MAP.title;
document.getElementById("mapSource").textContent = MAP.source;

render();
renderSpec();
renderChat();
fit();
</script>
