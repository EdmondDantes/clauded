                title="Where the panels sit"></button>
      </span>
      <div class="layout-card" id="layoutCard" hidden></div>
    </div>

    <div class="dock-body" id="dockBody">
      <section class="pane record-pane" id="recordPane" aria-label="Node record">
        <div class="pane-head">
          <span class="pane-name">Record</span>
          <button type="button" class="fold" data-fold="record" title="Fold the record"></button>
        </div>
        <div class="pane-body">
          <div class="record" id="panel" aria-live="polite" hidden></div>
        </div>
      </section>

      <div class="split" id="splitDock" role="separator" aria-label="Resize the record" tabindex="0"></div>

      <section class="pane chat-pane" id="chatPane" aria-label="Conversation with Claude">
        <div class="pane-head">
          <span class="pane-name">Conversation</span>
          <span class="chat-subject" id="chatAbout"></span>
          <button type="button" class="fold" data-fold="chat" title="Fold the conversation"></button>
        </div>
        <div class="chat-log" id="chatLog"></div>
        <div class="chat-options" id="chatOptions"></div>
        <div class="compose">
          <textarea id="chatField" rows="2" placeholder="Enter sends · Shift+Enter for a new line"></textarea>
          <button type="button" id="chatSend">Send</button>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
// Design map data. One record per node; `edges` carries the relation that the
// map spec declares, so the same renderer serves an architecture map with a
// different vocabulary.
// Map data. Generated from the sources named in `spec.sources`; every field
// below comes from a source document, never from the renderer.
//
//   title   name of the map, shown in the header and the browser tab
//   source  where the data was taken and when, e.g. "dev/DECISIONS.md · 2026-08-23"
//   spec    kinds — the vocabulary this map uses
//           sources — files the data was read from
//           edge — what an edge means in this map
//   nodes   id, kind, title, body; optional why, cost, status, origin
//           kind drives shape and column: aspect | question | decision | rejected
//           for an architecture map: aspect | dependency | module | knowledge
//   edges   [from, to, relation]; relation "holds" draws solid, "rejects" dashed
const MAP = {
  title: "",
  source: "",
  spec: { nodes: "", sources: [], edge: "" },
  nodes: [],
  edges: []
};

// Both vocabularies a map may speak: design on the left, architecture on the
// right. A kind decides the label, the shape of its marker and its column.
// Stamped when the page is rendered. The server reports the build it is serving
// now; a tab left open across an update reloads itself instead of talking a
// dialect the server no longer speaks.
const BUILD = "dev";

// The stamp of the data this page was rendered from. The server writes it in;
// opened as a file the page has none, and the first poll is what tells it where
// it stands.
const MAP_STAMP = "dev";

// Which map this page is: the name every request and every stored key carries.
// A project holds several maps, and they share neither a conversation nor a
// window arrangement. The server writes the name in; opened as a file, the
// address is all there is to read it from.
const SERVED_AS = "";
const MAP_NAME = SERVED_AS || decodeURIComponent(location.pathname.split("/").pop() || "map");

const KIND_LABEL = {
  aspect: "aspect",
  question: "open question",
  decision: "decision",
  rejected: "rejected",
  module: "module",
  knowledge: "knows",
  dependency: "depends on"
};

// The status a kind already carries. A design map names a node by where its
// question stands, so "open question · open" says one thing twice; the record
// draws the status only where the map disagrees with the kind.
const IMPLIED_STATUS = {
  question: "open",
  decision: "decided",
  rejected: "rejected"
};

const NODE_W = 232;
const NODE_H = 52;
const COL_GAP = 96;
const ROW_GAP = 18;

const svg = document.getElementById("canvas");
const panel = document.getElementById("panel");
const byId = new Map(MAP.nodes.map(n => [n.id, n]));


// One hue per aspect. The nodes and edges of an aspect's subtree take its hue,
// so a glance at a line says which aspect it belongs to.
const ASPECT_HUES = 3;
const aspectColour = new Map(
  MAP.nodes.filter(n => n.kind === "aspect")
    .map((aspect, index) => [aspect.id, `var(--aspect-${index % ASPECT_HUES + 1})`])
);

/** Aspect that owns each node; the first aspect reaching it wins. */
function aspectOwners() {
  const children = childrenOf(MAP.edges);
  const owner = new Map();
  const walk = (id, aspect) => {
    if (owner.has(id)) return;
    owner.set(id, aspect);
    for (const child of children.get(id) || []) walk(child, aspect);
  };

  for (const node of MAP.nodes) if (node.kind === "aspect") walk(node.id, node.id);
  return owner;
}

/** Children of every node, in the order the edges declare them. */
function childrenOf(edges) {
  const children = new Map();
  for (const [from, to] of edges) {
    if (!children.has(from)) children.set(from, []);
    children.get(from).push(to);
  }
  return children;
}

/**
 * Assigns a column by kind and stacks each column top to bottom, then lifts
 * every aspect to the vertical centre of the children it owns. Writes x and y
 * onto the nodes and returns the drawing bounds, used to fit the view.
 */
function layout(nodes, edges) {
  const shown = new Set(nodes.map(node => node.id));
  const children = childrenOf(edges);
  const parents = parentsOf(edges);
  const column = columnsOf(nodes, parents);

  const width = nodes.length ? Math.max(...nodes.map(node => column.get(node.id))) + 1 : 1;
  const lanes = Array.from({ length: width }, () => []);
  for (const node of nodes) lanes[column.get(node.id)].push(node);

  // Left to right: a lane is ordered by where the nodes pointing at it already
  // stand, so an edge runs as straight as the columns allow. A node nothing
  // points at keeps the order the file gives it.
  const pull = new Map();
  for (const lane of lanes) {
    lane.forEach((node, order) => {
      const above = (parents.get(node.id) || [])
        .filter(id => shown.has(id))
        .map(id => byId.get(id))
        .filter(parent => typeof parent.y === "number");
      pull.set(node.id, above.length
        ? above.reduce((sum, parent) => sum + parent.y, 0) / above.length
        : order * (NODE_H + ROW_GAP));
    });

    lane.sort((a, b) => pull.get(a.id) - pull.get(b.id));
    lane.forEach((node, order) => {
      node.x = column.get(node.id) * (NODE_W + COL_GAP);
      node.y = order * (NODE_H + ROW_GAP);
    });
  }

  // Right to left: a node stands against the middle of what it points at, which
  // reads as a tree rather than as stacks. Centring moves nodes onto each other,
  // so each lane is pushed apart again afterwards.
  for (let index = lanes.length - 2; index >= 0; index--) {
    for (const node of lanes[index]) {
      const kids = (children.get(node.id) || []).filter(id => shown.has(id)).map(id => byId.get(id));
      if (kids.length === 0) continue;
      const top = Math.min(...kids.map(kid => kid.y));
      const bottom = Math.max(...kids.map(kid => kid.y + NODE_H));
      node.y = (top + bottom) / 2 - NODE_H / 2;
    }

    lanes[index].sort((a, b) => a.y - b.y);
    let floor = null;
    for (const node of lanes[index]) {
      if (floor !== null && node.y < floor) node.y = floor;
      floor = node.y + NODE_H + ROW_GAP;
    }
  }

  if (nodes.length === 0) return { minX: 0, minY: 0, maxX: 1, maxY: 1 };

  const xs = nodes.map(n => n.x);
  const ys = nodes.map(n => n.y);
  return {
    minX: Math.min(...xs), minY: Math.min(...ys),
    maxX: Math.max(...xs) + NODE_W, maxY: Math.max(...ys) + NODE_H
  };
}

/** Who points at whom, the other way round from childrenOf. */
function parentsOf(edges) {
  const parents = new Map();
  for (const [from, to] of edges) {
    if (!parents.has(to)) parents.set(to, []);
    parents.get(to).push(from);
  }

  return parents;
}

/**
 * Which column each node stands in: how far it is from a node nothing points
 * at, counted along the edges. As many columns as the map is deep, and the
 * vocabulary no longer decides position — a map of ten kinds lays out by the
 * same rule as a map of three.
 *
 * The longest path, not the shortest: a node reachable both straight from an
 * aspect and through a chain stands after the chain, so an edge never points
 * backwards. A cycle has no longest path, and the node that closes it stops
 * where it was first reached.
 */
function columnsOf(nodes, parents) {
  const shown = new Set(nodes.map(node => node.id));
  const column = new Map();
  const walking = new Set();

  const depth = id => {
    if (column.has(id)) return column.get(id);
    if (walking.has(id)) return 0;

    walking.add(id);
    const above = (parents.get(id) || []).filter(other => shown.has(other));
    const mine = above.length ? Math.max(...above.map(depth)) + 1 : 0;
    walking.delete(id);

    column.set(id, mine);
    return mine;
  };

  for (const node of nodes) depth(node.id);
  return column;
}

/**
 * Nodes left after the hidden aspects are dropped. A node survives while any
 * visible aspect still reaches it, so a decision shared by two aspects stays
 * until both are hidden.
 */
function visibleNodes(hidden) {
  const children = childrenOf(MAP.edges);
  const reached = new Set();
  const walk = id => {
    if (reached.has(id)) return;
    reached.add(id);
    for (const child of children.get(id) || []) walk(child);
  };

  for (const node of MAP.nodes) {
    if (node.kind === "aspect" && !hidden.has(node.id)) walk(node.id);
  }

  return MAP.nodes.filter(node => reached.has(node.id));
}

/** Breaks a title into at most two lines of roughly `max` characters. */
function wrap(text, max) {
  const words = text.split(" ");
  const lines = [""];
  for (const word of words) {
    const line = lines[lines.length - 1];
    if (line && (line + " " + word).length > max && lines.length < 2) lines.push(word);
    else lines[lines.length - 1] = line ? line + " " + word : word;
  }
  if (lines[1] && lines[1].length > max) lines[1] = lines[1].slice(0, max - 1) + "…";
  return lines;
}

const NS = "http://www.w3.org/2000/svg";
const el = (name, attrs = {}) => {
  const node = document.createElementNS(NS, name);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
};

/** Marks the node kind by shape: square aspect, diamond question, circle decision. */
function mark(kind) {
  const square = { class: "mark", x: 12, y: NODE_H / 2 - 5, width: 10, height: 10 };

  if (kind === "aspect") return el("rect", { ...square, rx: 1.5 });
  if (kind === "module") return el("rect", { ...square, x: 11, width: 12, height: 8, y: NODE_H / 2 - 4, rx: 1 });
  if (kind === "question" || kind === "dependency") {
    return el("rect", { ...square, transform: `rotate(45 17 ${NODE_H / 2})` });
  }

  return el("circle", { class: "mark", cx: 17, cy: NODE_H / 2, r: 5.5 });
}

const viewport = el("g");
const edgeLayer = el("g");
const nodeLayer = el("g");
viewport.append(edgeLayer, nodeLayer);
svg.append(viewport);

const hidden = new Set();
let bounds = { minX: 0, minY: 0, maxX: 1, maxY: 1 };
let edgeShapes = [];
let nodeShapes = new Map();
let selected = null;
let waiting = null;
let presence = "offline";
let mapStamp = MAP_STAMP === "dev" ? null : MAP_STAMP;
const settled = new Map();
const unread = new Set();

// One conversation for the whole map. Each line carries the node it is about —
// whatever was selected when it was written — so a subject is a label, not a
// separate thread. Lines wait here until Apply and survive a reload through
// localStorage; with the server running they travel as they are written.
const pending = { chat: [] };
// Whether the round on screen has already been handed over. It stops a second
// press of Finish from sending an empty round, and a line written afterwards
// opens the next one.
let handedOver = false;
const STORE_KEY = `map-chat:${MAP_NAME}`;

function loadPending() {
  try {
    // Until the conversation was split per map it was stored under one key. The
    // first map to open takes what is there and clears it, so a draft written
    // before the split is not lost on the upgrade.
    const legacy = localStorage.getItem("map-chat");
    if (legacy !== null && localStorage.getItem(STORE_KEY) === null) {
      localStorage.setItem(STORE_KEY, legacy);
      localStorage.removeItem("map-chat");
    }

    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    if (Array.isArray(raw)) pending.chat.push(...raw);
  } catch (error) {
    // No storage, or a stale value: the page works without either.
  }
}

// How much of the conversation the browser keeps. Applied lines are with Claude
// and on the server, which hands back whatever this page is missing, so only the
// tail of them is worth storing.
const KEEP_LINES = 200;

function savePending() {
  try {
    // A line that has not been handed over exists nowhere else, so every one of
    // them is kept; the rest are trimmed to the tail.
    const kept = new Set(pending.chat.filter(message => !message.applied));
    for (const message of pending.chat.slice(-KEEP_LINES)) kept.add(message);
    localStorage.setItem(STORE_KEY, JSON.stringify(pending.chat.filter(message => kept.has(message))));
  } catch (error) {
    // Storage can be unavailable; losing the draft beats a broken page.
  }
}

/** Messages the reader has written and not yet applied. */
function pendingCount() {
  return pending.chat.filter(message => message.role === "you" && !message.applied).length;
}

/** The reader's last word about a node — what an answer amounts to. */
function answerOf(id) {
  const mine = pending.chat.filter(message => message.role === "you" && message.about === id);
  return mine.length ? mine[mine.length - 1].text : null;
}

/** The button that drops an aspect and its subtree out of the view. */
function hideButton(node) {
  const button = el("g", {
    class: "hide-btn", transform: `translate(${NODE_W - 16} 16)`,
    tabindex: "0", role: "button", "aria-label": `Hide aspect ${node.title}`
  });
  button.append(el("circle", { r: 8 }));
  button.append(el("line", { x1: -3.2, y1: -3.2, x2: 3.2, y2: 3.2 }));
  button.append(el("line", { x1: -3.2, y1: 3.2, x2: 3.2, y2: -3.2 }));

  const hide = event => {
    event.stopPropagation();
    hidden.add(node.id);
    render();
    fit();
  };

  button.addEventListener("click", hide);
  button.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); hide(event); }
  });
  return button;
}

/** Draws the graph for the aspects that are currently shown. */
function render() {
  edgeLayer.textContent = "";
  nodeLayer.textContent = "";
  nodeShapes = new Map();

  const nodes = visibleNodes(hidden);
  const owner = aspectOwners();
  const colourOf = id => aspectColour.get(owner.get(id)) || "var(--line-strong)";
  const shown = new Set(nodes.map(n => n.id));
  const edges = MAP.edges.filter(([from, to]) => shown.has(from) && shown.has(to));
  bounds = layout(nodes, edges);

  edgeShapes = edges.map(([from, to, relation]) => {
    const a = byId.get(from);
    const b = byId.get(to);
    const x1 = a.x + NODE_W;
    const y1 = a.y + NODE_H / 2;
    const x2 = b.x;
    const y2 = b.y + NODE_H / 2;
    const bend = (x2 - x1) / 2;
    const path = el("path", {
      class: "edge " + relation,
      d: `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`
    });
    path.style.setProperty("--edge-color", colourOf(from));
    edgeLayer.append(path);
    return { path, from, to };
  });

  for (const node of nodes) {
    const group = el("g", {
      class: "node", "data-kind": node.kind, transform: `translate(${node.x} ${node.y})`,
      tabindex: "0", role: "button", "aria-label": `${KIND_LABEL[node.kind]}: ${node.title}`
    });
    group.style.setProperty("--aspect-color", colourOf(node.id));
    group.append(el("rect", { class: "plate", width: NODE_W, height: NODE_H }));
    group.append(el("rect", { class: "state", x: 1, y: 6, height: NODE_H - 12, rx: 1.5 }));
    group.append(mark(node.kind));

    const kindLabel = el("text", { class: "kind", x: 32, y: 18 });
    kindLabel.textContent = KIND_LABEL[node.kind].toUpperCase();
    group.append(kindLabel);

    wrap(node.title, 26).forEach((line, index) => {
      const text = el("text", { class: "title", x: 32, y: 34 + index * 14 });
      text.textContent = line;
      group.append(text);
    });

    if (node.kind === "aspect") group.append(hideButton(node));

    group.addEventListener("click", () => select(node.id));
    group.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(node.id); }
    });

    nodeLayer.append(group);
    nodeShapes.set(node.id, group);
  }

  renderAspectBar();
  renderTally(nodes);
  renderNodeStates();
  updateApply();
  if (selected && nodeShapes.has(selected)) select(selected);
  else if (selected) clearSelection();
}

/**
 * Counts the nodes on the map by status and shows how far the questions have
 * been answered. Hidden aspects drop out of the count with their nodes.
 */
function renderTally(nodes) {
  const tally = document.getElementById("tally");
  tally.textContent = "";

  const total = status => nodes.filter(node => node.status === status).length;
  const open = total("open");
  const decided = total("decided");
  const rejected = total("rejected");
  if (open + decided + rejected === 0) return;

  for (const [status, value] of [["open", open], ["decided", decided], ["rejected", rejected]]) {
    if (value === 0) continue;
    const count = document.createElement("span");
    count.className = "count " + status;
    const number = document.createElement("b");
    number.textContent = value;
    count.append(number, document.createTextNode(status));
    tally.append(count);
  }

  if (open + decided === 0) return;
  const progress = document.createElement("span");
  progress.className = "progress";
  progress.title = `${decided} of ${open + decided} answered`;
  const fill = document.createElement("i");
  fill.style.width = Math.round(decided / (open + decided) * 100) + "%";
  progress.append(fill);
  tally.append(progress);
}

/** One chip per aspect: pressed means the aspect is on the map. */
function renderAspectBar() {
  const bar = document.getElementById("aspectBar");
  bar.textContent = "";

  // Filtering and commands go into groups of their own, so the strip does not
  // read as one row of interchangeable buttons.
  const filters = document.createElement("div");
  filters.className = "bar-filters";
  bar.append(filters);

  const owner = aspectOwners();
  for (const aspect of MAP.nodes.filter(n => n.kind === "aspect")) {
    const shown = !hidden.has(aspect.id);
    const size = MAP.nodes.filter(n => owner.get(n.id) === aspect.id && n.id !== aspect.id).length;

    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.setAttribute("aria-pressed", String(shown));
    chip.style.setProperty("--aspect-color", aspectColour.get(aspect.id));

    const dot = document.createElement("span");
    dot.className = "dot";
    const name = document.createElement("span");
    name.textContent = aspect.title;
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = size;
    count.title = `${size} nodes`;
    chip.append(dot, name, count);

    // An aspect that still holds questions carries the open colour as a pip:
    // two numbers side by side read as a ratio and need a legend.
    const openHere = MAP.nodes.filter(n => owner.get(n.id) === aspect.id && n.status === "open").length;
    if (openHere) {
      const pip = document.createElement("i");
      pip.className = "pip";
      pip.title = `${openHere} open`;
      chip.append(pip);
    }

    chip.addEventListener("click", () => {
      if (shown) hidden.add(aspect.id);
      else hidden.delete(aspect.id);
      render();
      fit();
    });

    filters.append(chip);
  }

  const reset = document.createElement("button");
  reset.type = "button";
  reset.className = "reset";
  reset.textContent = "Show all";
  reset.hidden = hidden.size === 0;
  reset.addEventListener("click", () => {
    hidden.clear();
    render();
    fit();
  });
  filters.append(reset);

  const actions = document.createElement("div");
  actions.className = "bar-actions";
  bar.append(actions);

  const qa = document.createElement("button");
  qa.type = "button";
  qa.className = "mode-toggle";
  // A phone strip is mostly chips, so the label drops its first two words
  // there instead of the chips dropping their room.
  const wide = document.createElement("span");
  wide.className = "wide-label";
  wide.textContent = "One question at a time";
  const narrow = document.createElement("span");
  narrow.className = "narrow-label";
  narrow.textContent = "One at a time";
  qa.append(wide, narrow);
  qa.title = "Ask Claude to take the open questions one at a time";
  qa.addEventListener("click", askOneAtATime);
  actions.append(qa);

  const apply = document.createElement("button");
  apply.type = "button";
  apply.className = "apply";
  apply.id = "applyButton";
  apply.addEventListener("click", applyPending);
  actions.append(apply);

  // The button is built empty here and carries its label only from updateApply,
  // so a redraw of the strip has to ask for the label back.
  updateApply();
}

/** Opens a node in the panel and dims everything it is not connected to. */
function select(id) {
  selected = id;
  const lit = new Set([id]);
  for (const { from, to } of edgeShapes) {
    if (from === id) lit.add(to);
    if (to === id) lit.add(from);
  }

  svg.classList.add("has-selection");
  for (const [nodeId, group] of nodeShapes) {
    group.classList.toggle("lit", lit.has(nodeId));
    group.classList.toggle("selected", nodeId === id);
  }
  for (const { path, from, to } of edgeShapes) {
    path.classList.toggle("lit", from === id || to === id);
  }

  renderPanel(byId.get(id), [...lit].filter(other => other !== id));
  renderChatSubject();
  panel.hidden = false;
  panel.style.setProperty("--aspect-color", aspectColour.get(aspectOwners().get(id)) || "var(--accent)");
  unread.delete(id);
  if (nodeShapes.has(id)) nodeShapes.get(id).classList.remove("unread");
  bringIntoView(byId.get(id));
  window.mapBridge?.select(id);
}

function clearSelection() {
  selected = null;
  renderChatSubject();
  panel.hidden = true;
  svg.classList.remove("has-selection");
  for (const group of nodeShapes.values()) group.classList.remove("lit", "selected");
  for (const { path } of edgeShapes) path.classList.remove("lit");
  renderSpec();
}

function renderSpec() {
  panel.innerHTML = "";
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "Pick a node to read the full record. Neighbours stay lit; everything else dims.";
  panel.append(hint);

  const spec = document.createElement("div");
  spec.className = "spec";
  const rows = [
    ["Nodes", MAP.spec.nodes],
    ["Edge means", MAP.spec.edge]
  ];
  for (const [label, value] of rows) {
    const row = document.createElement("div");
    const dt = document.createElement("span");
    dt.className = "panel-kind";
    dt.textContent = label;
    const dd = document.createElement("span");
    dd.textContent = value;
    row.append(dt, dd);
    spec.append(row);
  }

  const sources = document.createElement("div");
  const label = document.createElement("span");
  label.className = "panel-kind";
  label.textContent = "Reads";
  sources.append(label);
  for (const source of MAP.spec.sources) {
    const code = document.createElement("code");
    code.textContent = source;
    sources.append(code);
  }
  spec.append(sources);
  panel.append(spec);
}

function renderPanel(node, neighbours) {
  panel.innerHTML = "";

  // What the node is, where it stands and the way out share one line, and the
  // state is left out where the kind already carries it.
  const meta = document.createElement("div");
  meta.className = "record-meta";
  panel.append(meta);

  const kind = document.createElement("span");
  kind.className = "panel-kind";
  kind.textContent = KIND_LABEL[node.kind];
  meta.append(kind);

  if (node.status && node.status !== IMPLIED_STATUS[node.kind]) {
    const status = document.createElement("span");
    status.className = "status " + node.status;
    status.textContent = node.status;
    meta.append(status);
  }

  const close = document.createElement("button");
  close.type = "button";
  close.className = "record-close";
  close.textContent = "✕";
  close.title = "Close the record";
  close.addEventListener("click", clearSelection);
  meta.append(close);

  const title = document.createElement("h2");
  title.textContent = node.title;
  panel.append(title);

  const list = document.createElement("dl");
  const rows = [
    ["What", node.body],
    ["Why", node.why],
    ["Price", node.cost]
  ].filter(([, value]) => value);

  for (const [label, value] of rows) {
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    list.append(dt, dd);
  }

  if (neighbours.length) {
    const dt = document.createElement("dt");
    dt.textContent = "Connected";
    const dd = document.createElement("dd");
    dd.className = "links";
    for (const id of neighbours) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = byId.get(id).title;
      button.addEventListener("click", () => select(id));
      dd.append(button);
    }
    list.append(dt, dd);
  }

  panel.append(list);

  if (node.refs && node.refs.length) {
    const dt = document.createElement("dt");
    dt.textContent = "Files";
    const dd = document.createElement("dd");
    dd.className = "refs";
    for (const ref of node.refs) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = ref.lines ? `${ref.file}:${ref.lines}` : ref.file;
      button.disabled = !ref.code;
      button.title = ref.code ? "Open the fragment" : "No fragment stored for this file";
      button.addEventListener("click", () => openCode(ref));
      dd.append(button);
    }

    list.append(dt, dd);
  }

  if (node.origin) {
    const origin = document.createElement("p");
    origin.className = "origin";
    origin.textContent = node.origin;
    panel.append(origin);
  }
}

/**
 * Draws the whole conversation. One log, one field: the selected node is the
 * subject of what is written next, and a line names the subject it had.
 */
function renderChat() {
  const log = document.getElementById("chatLog");
  const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
  log.textContent = "";

  let lastSubject = null;
  for (const message of pending.chat) {
    // Apply hands the round over and writes a summary of the lines above it.
    // The log marks the handover and leaves the summary out: it is a repeat.
    if (message.kind === "finish") {
      const mark = document.createElement("div");
      mark.className = "round-end";
      mark.textContent = "Handed over";
      log.append(mark);
      lastSubject = null;
      continue;
    }

    if (message.about !== lastSubject && message.about && byId.has(message.about)) {
      const subject = document.createElement("button");
      subject.type = "button";
      subject.className = "subject-line";
      subject.textContent = "— " + byId.get(message.about).title + " —";
      subject.addEventListener("click", () => select(message.about));
      log.append(subject);
    }

    lastSubject = message.about;

    const line = document.createElement("div");
    line.className = "msg " + message.role
      + (message.role === "you" && !message.applied ? " pending" : "")
      + (message.undelivered ? " undelivered" : "");
    line.textContent = message.text;
    if (message.undelivered) line.title = "Not delivered yet";
    log.append(line);
  }

  renderTyping();
  if (atEnd) requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  renderChatSubject();
}

/**
 * A bubble at the end of the log while Claude is working: an answer is coming,
 * and the log says so where the answer will appear.
 */
function renderTyping() {
  const log = document.getElementById("chatLog");
  const existing = log.querySelector(".typing");
  const show = presence === "working";

  if (!show) {
    if (existing) existing.remove();
    return;
  }

  if (existing) {
    log.append(existing);
    return;
  }

  const bubble = document.createElement("div");
  bubble.className = "msg claude typing";
  bubble.innerHTML = "<i></i><i></i><i></i>";
  log.append(bubble);
  log.scrollTop = log.scrollHeight;
}

const PRESENCE_WORDS = {
  waiting: ["waiting", "Claude is waiting for your next message"],
  working: ["working", "Claude is on the map, doing something else right now"],
  offline: ["away", "Nobody is on the map; a message will wait"]
};

/** The dot and the word: what Claude is doing, in one glance. */
function renderPresence() {
  const box = document.getElementById("presence");
  const state = waiting ? "waiting" : presence;
  const [word, hint] = PRESENCE_WORDS[state] || PRESENCE_WORDS.offline;

  box.dataset.state = state;
  box.title = waiting && waiting.note ? `${hint} — ${waiting.note}` : hint;
  box.querySelector("b").textContent = word;
}

/** The subject line and the shortcuts a question offers. */
function renderChatSubject() {
  const about = document.getElementById("chatAbout");
  const options = document.getElementById("chatOptions");
  const node = selected ? byId.get(selected) : null;

  about.textContent = "";
  const lead = document.createElement("span");
  lead.className = "lead";
  lead.textContent = "about";
  about.append(lead);

  if (node) {
    const label = document.createElement("button");
    label.type = "button";
    label.textContent = node.title;
    label.title = "Show this node";
    label.addEventListener("click", () => select(node.id));
    about.append(label);
  } else {
    const what = document.createElement("span");
    what.textContent = "the map — pick a node to change the subject";
    about.append(what);
  }

  renderPresence();

  options.textContent = "";
  for (const option of (node && node.options) || []) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = option;
    button.addEventListener("click", () => say(option));
    options.append(button);
  }
}

/** Adds one message from the reader and lets the server know, if it is there. */
function say(text, about = selected) {
  // Writing opens the round again, so Finish has something to hand over.
  handedOver = false;
  const message = { role: "you", text, about, at: new Date().toISOString() };
  pending.chat.push(message);
  commitPending();
  renderChat();
  deliver(message);
}

/**
 * Hands one line to the server, and remembers if it did not arrive: a line the
 * server never saw would otherwise sit in the log looking sent while Claude
 * waits for something that never comes.
 */
function deliver(message) {
  if (!window.mapBridge) return;

  window.mapBridge.message(message.text, message.about).then(() => {
    delete message.undelivered;
    savePending();
    renderChat();
  }).catch(() => {
    message.undelivered = true;
    savePending();
    renderChat();
    toast("Not delivered — will try again");
  });
}

/** Sends again whatever never reached the server. */
function resend() {
  if (!window.mapBridge) return;
  for (const message of pending.chat) {
    if (message.role === "you" && message.undelivered && !message.id) deliver(message);
  }
}

/**
 * Takes the map's data again after it changed on disk and grows the graph in
 * place: new nodes arrive with a mark on them, so it is visible that they were
 * just built rather than always there.
 */
async function growMap() {
  let next;
  try {
    next = await fetch(`/api/map/${encodeURIComponent(MAP_NAME)}`)
      .then(response => (response.ok ? response.json() : null));
  } catch (error) {
    return false;
  }

  if (!next || !Array.isArray(next.nodes)) return false;

  // Compare what the map says, not where the layout happened to put it: x and
  // y are written onto every node on each render.
  const meaning = node => JSON.stringify([
    node.kind, node.title, node.body, node.why, node.cost, node.status, node.options, node.refs
  ]);

  const before = new Map(MAP.nodes.map(node => [node.id, meaning(node)]));
  const arrived = next.nodes.filter(node => !before.has(node.id));
  const changed = next.nodes.filter(node =>
    before.has(node.id) && before.get(node.id) !== meaning(node));
  const gone = [...before.keys()].filter(id => !next.nodes.some(node => node.id === id));

  MAP.nodes = next.nodes;
  MAP.edges = next.edges;
  MAP.spec = next.spec || MAP.spec;
  byId.clear();
  for (const node of MAP.nodes) byId.set(node.id, node);

  const view = { scale, offsetX, offsetY };
  render();

  // Framing the graph again is for a graph that grew. A node rewritten in place
  // leaves the picture where it was, so the reader's eye keeps its place.
  if (moved || arrived.length + gone.length === 0) {
    scale = view.scale;
    offsetX = view.offsetX;
    offsetY = view.offsetY;
    applyTransform();
  } else {
    fit();
  }

  for (const node of arrived) markFresh(node.id);
  for (const node of changed) markTouched(node.id);

  const said = [];
  if (arrived.length) said.push(`new: ${arrived.map(node => node.title).join(", ")}`);
  if (changed.length) said.push(`changed: ${changed.map(node => node.title).join(", ")}`);
  if (gone.length) said.push(`removed: ${gone.length}`);
  if (said.length) toast(said.join(" · "));

  // Never move the reader's subject out from under them while they are writing.
  const typing = document.getElementById("chatField").value.trim().length > 0;
  if (arrived.length && !typing) select(arrived[arrived.length - 1].id);
  else if (selected && byId.has(selected)) select(selected);
  else if (selected) clearSelection();

  return true;
}

/** The questions the map still has open, in the order the map lists them. */
function openQuestions() {
  return visibleNodes(hidden)
    .filter(node => node.kind === "question" && node.status === "open" && !settled.has(node.id));
}

/** Redraws what shows the conversation, so it stays current. */
function refreshBlock() {
  renderChat();
}

/** Saves the draft and refreshes everything that shows how much is waiting. */
function commitPending() {
  savePending();
  updateApply();
  renderNodeStates();
  renderTally(visibleNodes(hidden));
}

/**
 * Nodes built or changed in the last few seconds. Kept as state rather than a
 * class on the element: the graph is redrawn whenever the map grows, and a
 * class set on the old element would vanish with it.
 */
const fresh = new Map();
const touched = new Map();
const FRESH_FOR = 8000;

function markFresh(id) {
  mark(fresh, id);
}

/** A node that was already there and has just been rewritten. */
function markTouched(id) {
  mark(touched, id);
}

function mark(register, id) {
  register.set(id, Date.now());
  renderNodeStates();
  setTimeout(() => {
    if (Date.now() - (register.get(id) || 0) >= FRESH_FOR - 50) {
      register.delete(id);
      renderNodeStates();
    }
  }, FRESH_FOR);
}

/** Marks the nodes that already carry an answer. */
function renderNodeStates() {
  for (const [id, group] of nodeShapes) {
    group.classList.toggle("answered", answerOf(id) !== null);
    group.classList.toggle("settled", settled.has(id));
    group.classList.toggle("unread", unread.has(id));
    group.classList.toggle("fresh", fresh.has(id));
    group.classList.toggle("touched", touched.has(id));
  }
}

function updateApply() {
  const button = document.getElementById("applyButton");
  if (!button) return;
  // This button ends the round: until it is pressed the work goes on.
  const count = pendingCount();
  // A round already handed over, with nothing written since, has nothing to
  // hand over again: pressing Finish twice would replay the whole log, or hand
  // over an empty one. The flag is set the moment Finish is pressed, because
  // the line that records it only comes back from the server a poll later.
  const closed = handedOver && count === 0;
  const label = count ? `Finish · ${count} to hand over` : closed ? "Handed over" : "Finish";
  button.disabled = closed;
  // Rewriting the same text on every poll made the button flicker.
  if (button.textContent !== label) button.textContent = label;
  button.title = "Hand the conversation over and end the round";
}

/**
 * Hands the draft over. With the map plugin running, `window.mapBridge` takes
 * it and the session picks it up; without it, the summary goes to the clipboard
 * and the reader pastes it into the conversation.
 */
async function applyPending() {
  if (handedOver && pendingCount() === 0) return;
  handedOver = true;

  const lines = [`# ${MAP.title}`];
  for (const message of pending.chat.filter(message => !message.applied)) {
    const about = message.about && byId.has(message.about) ? ` (${byId.get(message.about).title})` : "";
    lines.push(`- ${message.role}${about}: ${message.text}`);
  }

  const summary = lines.join("\n");
  const payload = {
    chat: pending.chat.filter(message => !message.applied)
      .map(({ role, text, about }) => ({ role, text, about })),
    answers: lastWordPerNode(),
    summary
  };

  if (window.mapBridge && typeof window.mapBridge.apply === "function") {
    await window.mapBridge.apply(payload);
    toast("Sent to Claude");
  } else {
    try {
      await navigator.clipboard.writeText(summary);
      toast("Copied — paste it into the conversation");
    } catch (error) {
      toast("Copy failed; the text is in the console");
      console.log(summary);
    }
  }

  for (const message of pending.chat) message.applied = true;
  commitPending();
  renderChat();
}

/** The reader's last word about each node, next to the conversation itself. */
function lastWordPerNode() {
  const answers = {};
  // An answer answers a question. A line about a decision or an aspect is a
  // remark, and handing it over as the node's answer read as one.
  for (const message of pending.chat.filter(message => !message.applied)) {
    if (message.role !== "you" || !message.about) continue;
    if (byId.get(message.about)?.kind !== "question") continue;
    answers[message.about] = message.text;
  }

  return answers;
}

let toastTimer = null;

function toast(text) {
  const box = document.getElementById("toast");
  box.textContent = text;
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, 2600);
}

/**
 * Opens one source fragment. The code travels inside the map: it is copied out
 * of the file when the map is rendered, so the page shows what the map was built
 * from even when the file has moved on. Colouring comes with it as `ref.html`
 * when the plugin server rendered the page; a static build shows plain text.
 */
function openCode(ref) {
  const box = document.getElementById("codeWindow");
  box.textContent = "";
  box.hidden = false;

  const card = document.createElement("div");
  card.className = "code-card";

  const head = document.createElement("div");
  head.className = "code-head";
  const path = document.createElement("span");
  path.className = "path";
  path.textContent = ref.file;
  const lines = document.createElement("span");
  lines.className = "lines";
  lines.textContent = ref.lines ? `:${ref.lines}` : "";
  const spacer = document.createElement("span");
  spacer.className = "spacer";

  const copy = document.createElement("button");
  copy.type = "button";
  copy.textContent = "Copy path";
  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(ref.lines ? `${ref.file}:${ref.lines}` : ref.file);
      toast("Path copied");
    } catch (error) {
      toast("Copy failed");
    }
  });

  const close = document.createElement("button");
  close.type = "button";
  close.textContent = "Close";
  close.addEventListener("click", closeCode);

  head.append(path, lines, spacer, copy, close);

  const body = document.createElement("pre");
  body.className = "code-body";
  card.append(head, body);
  box.append(card);
  close.focus();

  const cited = citedRange(ref);
  // The fragment the map carries is shown at once, because it needs no server.
  // The whole file replaces it when the server answers: fifteen lines say what
  // the line is and nothing about what it sits in.
  fillCode(body, ref.code || "", Array.isArray(ref.html) ? ref.html : null, cited.from, cited);

  if (!window.mapBridge || typeof window.mapBridge.source !== "function") return;

  window.mapBridge.source(ref.file).then(file => {
    if (box.hidden) return;
    fillCode(body, file.code || "", Array.isArray(file.html) ? file.html : null, 1, cited);
    if (file.clipped) lines.textContent = `${lines.textContent} · first part of the file`;
    const mark = body.querySelector(".row.cited");
    if (mark) body.scrollTop = Math.max(0, mark.offsetTop - body.clientHeight / 3);
  }).catch(() => {
    // No server, or the file has moved since the map was built: the fragment
    // stored in the map is what the reader gets, and it is already on screen.
  });
}

/** The first and last line the map cites, as numbers of the file. */
function citedRange(ref) {
  const parts = String(ref.lines || "").split("-");
  const from = parseInt(parts[0], 10) || 1;
  const to = parseInt(parts[1], 10) || from + (ref.code || "").split("\n").length - 1;
  return { from, to };
}

/**
 * Draws `code` into `body`, one row per line, numbering from `first`. `marked`
 * carries the same lines with colouring when a highlighter ran; a line it does
 * not cover falls back to plain text. Rows inside `cited` are marked, so the
 * lines the map points at stay findable in a file of four thousand.
 */
function fillCode(body, code, marked, first, cited) {
  body.textContent = "";

  code.split("\n").forEach((line, index) => {
    const number = first + index;
    const row = document.createElement("div");
    row.className = "row";
    if (number >= cited.from && number <= cited.to) row.classList.add("cited");

    const label = document.createElement("span");
    label.className = "ln";
    label.textContent = number;

    const text = document.createElement("code");
    if (marked && marked[index] !== undefined) text.innerHTML = marked[index];
    else text.textContent = line;

    row.append(label, text);
    body.append(row);
  });
}

function closeCode() {
  document.getElementById("codeWindow").hidden = true;
}

// What the button says to Claude. It names the mode and what the mode is for,
// because the agent on the other end reads it as an instruction, not as chat.
const ONE_AT_A_TIME =
  "Work through the open questions on this map one at a time: ask one question, "
  + "wait for the answer here, write what it settles onto the map, then ask the next. "
  + "One question per turn, and no lists.";

/**
 * Hands the mode to Claude instead of opening a window over the map. The page
 * has no way to conduct an interview on its own: the questions are Claude's,
 * and the answers only mean anything once Claude has read them. So the button
 * says so in the conversation, and the map goes on showing what is open.
 */
function askOneAtATime() {
  const questions = openQuestions();
  if (!questions.length) {
    toast("No open questions on the map");
    return;
  }

  select(questions[0].id);
  say(ONE_AT_A_TIME, questions[0].id);
  toast("Claude has the mode — one question at a time");
}

/**
 * On a phone the record slides up over the graph and leaves a band at the top;
 * the chosen node is moved into that band, or it would sit behind the sheet.
 * On a wide screen the panel takes its own column and nothing has to move.
 */
function bringIntoView(node) {
  const rect = svg.getBoundingClientRect();
  if (rect.width >= 640 || !node) return;

  const band = rect.height * 0.34;
  offsetX = rect.width / 2 - (node.x + NODE_W / 2) * scale;
  offsetY = band / 2 - (node.y + NODE_H / 2) * scale;
  applyTransform();
}

// View transform: wheel zooms around the pointer, drag pans, Fit frames the graph.
let scale = 1;
let offsetX = 0;
let offsetY = 0;

function applyTransform() {
  viewport.setAttribute("transform", `translate(${offsetX} ${offsetY}) scale(${scale})`);
}

function fit() {
  const rect = svg.getBoundingClientRect();
  const width = bounds.maxX - bounds.minX;
  const height = bounds.maxY - bounds.minY;
  const padding = rect.width < 640 ? 20 : 48;
  const fitted = Math.min((rect.width - padding * 2) / width, (rect.height - padding * 2) / height, 1.3);
  // On a phone the whole graph would shrink past reading size, so the fit stops
  // at a legible scale and the rest of the map is reached by dragging.
  scale = rect.width < 640 ? Math.max(fitted, 0.62) : fitted;
  offsetX = (rect.width - width * scale) / 2 - bounds.minX * scale;
  offsetY = (rect.height - height * scale) / 2 - bounds.minY * scale;
  applyTransform();
}

svg.addEventListener("wheel", event => {
  event.preventDefault();
  const rect = svg.getBoundingClientRect();
  const px = event.clientX - rect.left;
  const py = event.clientY - rect.top;
  moved = true;
  const factor = Math.exp(-event.deltaY * 0.0015);
  const next = Math.min(2.5, Math.max(0.3, scale * factor));
  offsetX = px - (px - offsetX) * (next / scale);
  offsetY = py - (py - offsetY) * (next / scale);
  scale = next;
  applyTransform();
}, { passive: false });

let dragging = null;
// Whether the reader has moved the view themselves; if they have, a map that
// grows must not yank it back to the overview.
let moved = false;
const touches = new Map();
let pinch = null;

const spread = () => {
  const [a, b] = [...touches.values()];
  return { distance: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
};

svg.addEventListener("pointerdown", event => {
  touches.set(event.pointerId, { x: event.clientX, y: event.clientY });

  if (touches.size === 2) {
    // Two fingers: pinch. The pan started by the first finger is dropped, or
    // the map would slide while the pinch scales it.
    dragging = null;
    const start = spread();
    pinch = { distance: start.distance, scale, x: start.x, y: start.y, offsetX, offsetY };
    return;
  }

  if (event.target.closest(".node")) return;
  dragging = { x: event.clientX - offsetX, y: event.clientY - offsetY };
  svg.setPointerCapture(event.pointerId);
  svg.classList.add("dragging");
});

svg.addEventListener("pointermove", event => {
  if (touches.has(event.pointerId)) touches.set(event.pointerId, { x: event.clientX, y: event.clientY });

  if (pinch && touches.size === 2) {
    const now = spread();
    const rect = svg.getBoundingClientRect();
    const next = Math.min(2.5, Math.max(0.3, pinch.scale * (now.distance / pinch.distance)));
    const px = pinch.x - rect.left;
    const py = pinch.y - rect.top;
    offsetX = px - (px - pinch.offsetX) * (next / pinch.scale);
    offsetY = py - (py - pinch.offsetY) * (next / pinch.scale);
    scale = next;
    applyTransform();
    return;
  }

  if (!dragging) return;
  moved = true;
  offsetX = event.clientX - dragging.x;
  offsetY = event.clientY - dragging.y;
  applyTransform();
});

const endDrag = event => {
  if (event) touches.delete(event.pointerId);
  if (touches.size < 2) pinch = null;
  dragging = null;
  svg.classList.remove("dragging");
};

svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);

svg.addEventListener("click", event => {
  if (!event.target.closest(".node") && selected) clearSelection();
});

document.addEventListener("keydown", event => {
  const inField = event.target instanceof HTMLElement && ["TEXTAREA", "INPUT"].includes(event.target.tagName);
  if (event.key === "Escape") {
    if (!document.getElementById("codeWindow").hidden) closeCode();
    else if (!layoutCard.hidden) showLayoutCard(false);
    else if (selected) clearSelection();
    return;
  }

  if (inField) return;
  if (event.key === "q") askOneAtATime();
});

document.getElementById("fit").addEventListener("click", () => { moved = false; fit(); });
document.getElementById("clear").addEventListener("click", clearSelection);
window.addEventListener("resize", fit);

// The plugin server is the only thing that serves this page over http, so its
// presence is the signal that a session is listening. Opened as a file, or as a
// published artifact, the page keeps everything to itself.
if (location.protocol === "http:" || location.protocol === "https:") {
  const post = (path, payload) => fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(response => response.json());

  window.mapBridge = {
    apply: payload => post("/api/apply", { ...payload, map: MAP_NAME }),
    select: id => post("/api/selection", { map: MAP_NAME, node: id }).catch(() => {}),
    message: (text, about) => post("/api/message", { map: MAP_NAME, text, about }),
    source: file => fetch(`/api/source?file=${encodeURIComponent(file)}`)
      .then(response => (response.ok ? response.json() : Promise.reject(new Error(String(response.status)))))
  };

  // Claude points at one question and replies in its thread; the page asks for
  // both on a timer, opens the question it is asked about, and shows the reply.
  let asked = null;
  let ticking = false;
  // The id of the newest line the server has handed over. It travels back as
  // `since`, so a poll carries what this page is missing instead of the log.
  let seenId = null;
  // Said once when a new build is held back, so the reader knows why the page
  // has not reloaded itself.
  let held = false;
  // Said once when the server stops answering about this map — renamed, deleted
  // or served from another project — instead of polling in silence.
  let lost = false;
  setInterval(async () => {
    if (ticking) return;
    ticking = true;
    try {
      const from = seenId ? `&since=${encodeURIComponent(seenId)}` : "";
      const news = await fetch(`/api/updates?map=${encodeURIComponent(MAP_NAME)}${from}`)
        .then(response => response.json());

      // The server knows this address and does not know this map: it was
      // renamed or deleted under the open page, and nothing typed here will
      // reach anyone until the page is pointed somewhere else.
      if (news.error) {
        if (!lost) {
          lost = true;
          toast(`The server no longer has this map: ${news.error}`);
        }
        return;
      }

      lost = false;

      // The map's own data changed — a node was added or settled while we
      // watched — so the graph on screen is out of date.
      if (mapStamp === null) mapStamp = news.map || "";
      else if (news.map && news.map !== mapStamp) {
        // Only accept the new stamp once the map actually came down; a failed
        // fetch must be retried on the next tick, not forgotten.
        if (await growMap()) mapStamp = news.map;
      }

      if (news.build && BUILD !== "dev" && news.build !== BUILD) {
        // A reload takes the box with it, and what is typed there exists
        // nowhere else. The new build waits until the box is empty.
        if (document.getElementById("chatField").value.trim()) {
          if (!held) {
            held = true;
            toast("The page was rebuilt — it reloads once the box is empty");
          }
          return;
        }

        toast("The map changed — reloading");
        setTimeout(() => location.reload(), 1200);
        return;
      }

      // Match by id, not by count: the page keeps its own history and the
      // server starts a fresh one, so counting made a new reply look old.
      // The server holds the conversation both sides can see; take whatever is
      // not here yet, matching by id and falling back to time plus text for
      // lines saved before ids existed.
      const key = message => message.id || `${message.at}|${message.text}`;
      const known = new Set(pending.chat.flatMap(message =>
        [message.id, `${message.at}|${message.text}`].filter(Boolean)));
      const fresh = (news.chat || []).filter(message => !known.has(key(message)));
      if (news.chat && news.chat.length) seenId = news.chat[news.chat.length - 1].id || seenId;

      if (fresh.length) {
        for (const message of fresh) {
          // Our own line comes back with an id it did not have when it was
          // written here; adopt the id instead of adding the line twice.
          const mine = message.role === "you" && pending.chat.find(local =>
            !local.id && local.role === "you" && local.text === message.text && local.about === message.about);

          if (mine) {
            mine.id = message.id;
            mine.at = message.at;
            continue;
          }

          // Whatever this page has written and not handed over is in its own
          // store, so a line arriving from the server is history — including
          // the summary Apply writes. Treating it as a draft would hand the
          // whole log over again the next time Finish is pressed.
          pending.chat.push({
            id: message.id, role: message.role, text: message.text,
            about: message.about, at: message.at, kind: message.kind, applied: true
          });
        }

        pending.chat.sort((a, b) => String(a.at).localeCompare(String(b.at)));
        savePending();
        renderChat();

        const last = fresh[fresh.length - 1];
        if (last.role === "claude" && last.about && byId.has(last.about) && selected !== last.about) {
          select(last.about);
        }
      }

      resend();
      presence = news.presence || "offline";
      renderPresence();
      renderTyping();

      for (const [id, mark] of Object.entries(news.resolved || {})) {
        if (settled.has(id)) continue;
        settled.set(id, mark);
        if (nodeShapes.has(id)) nodeShapes.get(id).classList.add("settled");
        refreshBlock();
      }

      waiting = news.focus || null;
      const node = waiting && waiting.node;
      if (node === asked) return;
      asked = node;
      if (!node || !byId.has(node)) return;
      hidden.clear();
      render();
      select(node);
      toast(waiting.note || "Claude is waiting for this answer");
    } catch (error) {
      // The server went away; the page keeps working on its own.
    } finally {
      ticking = false;
    }
  }, 1500);
}

// Layout: where the dock sits, which pane comes first, and how big each is.
// All of it is per-viewer taste, so it lives in this browser and nowhere else.
const LAYOUT_KEY = `map-layout:${MAP_NAME}`;
const main = document.getElementById("main");

const dockBody = document.getElementById("dockBody");
const recordPane = document.getElementById("recordPane");
const layoutButton = document.getElementById("layoutButton");
const layoutCard = document.getElementById("layoutCard");

// The smallest a pane or the graph is allowed to become while a handle is
// dragged, in CSS pixels: below this the pane holds nothing readable.
const MIN_PANE = 160;

// The six arrangements the card offers. Three axes — which edge the dock stands
// against, whether the panes stack or stand side by side — collapse into six
// pictures, and a picture is what a spatial choice is read from.
// The grid reads as a table: a column says which edge the dock stands against,
// a row says how the two panes divide it.
const ARRANGEMENTS = [
  { layout: "side", side: "left", flow: "stack", title: "Panels left, one above the other" },
  { layout: "bottom", side: "right", flow: "stack", title: "Panels below, one above the other" },
  { layout: "side", side: "right", flow: "stack", title: "Panels right, one above the other" },
  { layout: "side", side: "left", flow: "row", title: "Panels left, side by side" },
  { layout: "bottom", side: "right", flow: "row", title: "Panels below, side by side" },
  { layout: "side", side: "right", flow: "row", title: "Panels right, side by side" }
];

function loadLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}");
    if (saved.layout) main.dataset.layout = saved.layout;
    if (saved.side) main.dataset.side = saved.side;
    if (saved.flow) main.dataset.flow = saved.flow;
    if (saved.order) main.dataset.order = saved.order;
    if (saved.fold) main.dataset.fold = saved.fold;
    if (saved.dock) main.style.setProperty("--dock", saved.dock);
    if (saved.record) sizeRecord(saved.record);
  } catch (error) {
    // Nothing saved, or storage is unavailable: the defaults stand.
  }
}

function saveLayout() {
  try {
    localStorage.setItem(LAYOUT_KEY, JSON.stringify({
      layout: main.dataset.layout,
      side: main.dataset.side,
      flow: main.dataset.flow,
      order: main.dataset.order,
      fold: main.dataset.fold || undefined,
      dock: main.style.getPropertyValue("--dock").trim() || undefined,
      record: main.style.getPropertyValue("--record").trim() || undefined
    }));
  } catch (error) {
    // A layout that is not remembered still works.
  }
}

/**
 * Gives the record a height of its own. The cap that keeps an unsized record
 * from eating the conversation is lifted at the same time: once the reader has
 * dragged the handle, a pane that refuses to follow reads as a broken handle.
 */
function sizeRecord(length) {
  main.style.setProperty("--record", length);
  main.style.setProperty("--record-cap", "none");
}

/**
 * One arrangement drawn as a small picture: the graph block, and the two panels
 * where this arrangement puts them. Everything is painted in `currentColor`, so
 * the picture takes the accent when its button is the chosen one.
 */
function arrangementIcon(spec, width = 42, height = 28) {
  const svg = el("svg", { width, height, viewBox: `0 0 ${width} ${height}`, "aria-hidden": "true" });
  svg.append(el("rect", {
    x: .5, y: .5, width: width - 1, height: height - 1, rx: 3,
    fill: "none", stroke: "currentColor", "stroke-width": 1, opacity: .55
  }));

  const block = (x, y, w, h, opacity) =>
    svg.append(el("rect", { x, y, width: w, height: h, rx: 1.5, fill: "currentColor", opacity }));

  // Every length is a share of the frame: the same picture has to read at the
  // size of a button and at the size of a card tile.
  const pad = Math.max(2, Math.round(height * .11));
  const gap = height >= 24 ? 2 : 1;

  if (spec.layout === "side") {
    const dockSize = Math.max(6, Math.round(width * .34));
    const dockX = spec.side === "left" ? pad : width - pad - dockSize;
    const graphX = spec.side === "left" ? dockX + dockSize + gap : pad;
    block(graphX, pad, width - dockSize - 2 * pad - gap, height - 2 * pad, .2);

    if (spec.flow === "stack") {
      const half = (height - 2 * pad - gap) / 2;
      block(dockX, pad, dockSize, half, .6);
      block(dockX, pad + half + gap, dockSize, half, .6);
    } else {
      const half = (dockSize - gap) / 2;
      block(dockX, pad, half, height - 2 * pad, .6);
      block(dockX + half + gap, pad, half, height - 2 * pad, .6);
    }

    return svg;
  }

  const dockSize = Math.max(5, Math.round(height * .36));
  const graphHeight = height - 2 * pad - dockSize - gap;
  const dockY = pad + graphHeight + gap;
  block(pad, pad, width - 2 * pad, graphHeight, .2);

  if (spec.flow === "row") {
    const half = (width - 2 * pad - gap) / 2;
    block(pad, dockY, half, dockSize, .6);
    block(pad + half + gap, dockY, half, dockSize, .6);
  } else {
    const half = (dockSize - gap) / 2;
    block(pad, dockY, width - 2 * pad, half, .6);
    block(pad, dockY + half + gap, width - 2 * pad, half, .6);
  }

  return svg;
}

/** True when the page is arranged the way this picture shows it. */
function isCurrent(spec) {
  if (spec.layout !== main.dataset.layout || spec.flow !== main.dataset.flow) return false;
  return spec.layout !== "side" || spec.side === main.dataset.side;
}

function chevronIcon(direction) {
  const svg = el("svg", { width: 14, height: 14, viewBox: "0 0 16 16", "aria-hidden": "true" });
  const path = direction === "up" ? "M4 10l4-4 4 4" : "M4 6l4 4 4-4";
  svg.append(el("path", {
    d: path, fill: "none", stroke: "currentColor",
    "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round"
  }));
  return svg;
}

/**
 * Puts the map's title in the header, and behind it the project's other maps.
 *
 * The menu appears only when the server answers with more than one map: opened
 * as a file, or in a project that holds a single map, the title is plain text.
 */
async function renderMapPicker() {
  const title = document.getElementById("mapTitle");
  title.textContent = MAP.title;

  if (location.protocol !== "http:" && location.protocol !== "https:") return;

  let answer;
  try {
    answer = await fetch("/api/maps").then(response => (response.ok ? response.json() : null));
  } catch (error) {
    return;
  }

  const listing = (answer && answer.maps) || [];
  if (listing.length < 2) return;

  title.textContent = "";
  const button = document.createElement("button");
  button.type = "button";
  button.className = "map-button";
  button.setAttribute("aria-haspopup", "true");
  button.setAttribute("aria-expanded", "false");
  button.title = "The maps of this project";
  button.append(document.createTextNode(MAP.title), chevronIcon("down"));
  title.append(button);

  const menu = document.createElement("div");
  menu.className = "map-menu";
  menu.hidden = true;

  for (const map of listing) {
    const item = document.createElement("a");
    item.className = "map-item";
    item.href = `/map/${encodeURIComponent(map.name)}`;
    if (map.name === MAP_NAME) item.setAttribute("aria-current", "page");
    const label = document.createElement("span");
    label.textContent = map.title;
    const file = document.createElement("code");
    file.textContent = map.name;
    item.append(label, file);
    menu.append(item);
  }

  title.append(menu);

  const show = open => {
    menu.hidden = !open;
    button.setAttribute("aria-expanded", String(open));
  };

  button.addEventListener("click", () => show(menu.hidden));
  document.addEventListener("click", event => {
    if (!menu.hidden && !title.contains(event.target)) show(false);
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") show(false);
  });
}

function swapIcon() {
  const svg = el("svg", { width: 14, height: 14, viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.append(el("path", {
    d: "M3 6h9l-2.5-2.5M13 10H4l2.5 2.5", fill: "none", stroke: "currentColor",
    "stroke-width": 1.4, "stroke-linecap": "round", "stroke-linejoin": "round"
  }));
  return svg;
}

/** Applies one arrangement and redraws everything that shows it. */
function arrange(change) {
  change();
  saveLayout();
  renderLayout();
  fit();
}

function renderLayoutCard() {
  layoutCard.textContent = "";

  const label = document.createElement("span");
  label.className = "card-label";
  label.textContent = "Arrangement";
  layoutCard.append(label);

  const grid = document.createElement("div");
  grid.className = "grid";

  for (const spec of ARRANGEMENTS) {
    const button = document.createElement("button");
    button.type = "button";
    button.title = spec.title;
    button.setAttribute("aria-label", spec.title);
    button.setAttribute("aria-pressed", String(isCurrent(spec)));
    button.append(arrangementIcon(spec));
    button.addEventListener("click", () => arrange(() => {
      main.dataset.layout = spec.layout;
      main.dataset.side = spec.side;
      main.dataset.flow = spec.flow;
    }));
    grid.append(button);
  }

  layoutCard.append(grid);

  const swap = document.createElement("button");
  swap.type = "button";
  swap.className = "swap";
  swap.title = "Swap the record and the conversation";
  const order = document.createElement("span");
  order.textContent = main.dataset.order === "chat-first" ? "Conversation first" : "Record first";
  swap.append(order, swapIcon());
  swap.addEventListener("click", () => arrange(() => {
    main.dataset.order = main.dataset.order === "chat-first" ? "record-first" : "chat-first";
  }));
  layoutCard.append(swap);
}

/** Redraws the layout button, the card behind it and the two fold buttons. */
function renderLayout() {
  layoutButton.textContent = "";
  const current = ARRANGEMENTS.find(isCurrent) || ARRANGEMENTS[2];
  layoutButton.append(arrangementIcon(current, 24, 16), chevronIcon("down"));
  layoutButton.title = `${current.title} — press to change`;

  for (const button of document.querySelectorAll(".fold")) {
    const folded = main.dataset.fold === button.dataset.fold;
    const name = button.dataset.fold === "record" ? "the record" : "the conversation";
    button.textContent = "";
    button.append(chevronIcon(folded ? "down" : "up"));
    button.title = folded ? `Unfold ${name}` : `Fold ${name}`;
    button.setAttribute("aria-expanded", String(!folded));
  }

  if (!layoutCard.hidden) renderLayoutCard();
}

function showLayoutCard(open) {
  layoutCard.hidden = !open;
  layoutButton.setAttribute("aria-expanded", String(open));
  if (open) renderLayoutCard();
}

layoutButton.addEventListener("click", event => {
  event.stopPropagation();
  showLayoutCard(layoutCard.hidden);
});

document.addEventListener("click", event => {
  if (!layoutCard.hidden && !layoutCard.contains(event.target)) showLayoutCard(false);
});

for (const button of document.querySelectorAll(".fold")) {
  button.addEventListener("click", () => arrange(() => {
    if (main.dataset.fold === button.dataset.fold) delete main.dataset.fold;
    else main.dataset.fold = button.dataset.fold;
  }));
}

/**
 * Drags one handle. `variable` is the length the drag writes, `panel` the
 * element that length sizes, `within` the box the panel may not fill entirely.
 *
 * Which way the pointer moves and which way the panel grows are read from the
 * boxes at the start of every drag rather than from the arrangement: the phone
 * rules put the dock below whatever the arrangement says, and a drag that
 * trusts the arrangement then pulls the wrong way.
 */
function draggable(handle, variable, panel, within) {
  handle.addEventListener("pointerdown", event => {
    if (main.dataset.fold) return;
    event.preventDefault();
    handle.setPointerCapture(event.pointerId);

    const grip = handle.getBoundingClientRect();
    const box = panel.getBoundingClientRect();
    const bounds = within.getBoundingClientRect();
    const horizontal = grip.width < grip.height;
    const startSize = horizontal ? box.width : box.height;
    const start = horizontal ? event.clientX : event.clientY;
    const limit = horizontal ? bounds.width : bounds.height;
    // A panel lying past the handle grows as the pointer comes back towards the
    // origin; one lying before it grows as the pointer goes the other way.
    const flip = (horizontal ? box.left < grip.left : box.top < grip.top) ? -1 : 1;

    const move = moveEvent => {
      const now = horizontal ? moveEvent.clientX : moveEvent.clientY;
      const room = Math.max(limit - MIN_PANE, MIN_PANE);
      const next = Math.min(Math.max(startSize + (start - now) * flip, MIN_PANE), room);
      if (variable === "--record") sizeRecord(`${Math.round(next)}px`);
      else main.style.setProperty(variable, `${Math.round(next)}px`);
      applyTransform();
    };

    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
      saveLayout();
      fit();
    };

    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
  });
}

draggable(document.getElementById("splitMain"), "--dock", document.getElementById("dock"), main);
draggable(document.getElementById("splitDock"), "--record", recordPane, dockBody);

loadLayout();
renderLayout();

const chatField = document.getElementById("chatField");
chatField.addEventListener("keydown", event => {
  if (event.key !== "Enter" || event.shiftKey) return;
  event.preventDefault();
  const text = chatField.value.trim();
  if (!text) return;
  chatField.value = "";
  say(text);
});

document.getElementById("chatSend").addEventListener("click", () => {
  const text = chatField.value.trim();
  if (!text) return;
  chatField.value = "";
  say(text);
});

loadPending();
document.title = MAP.title || "Map";
renderMapPicker();
document.getElementById("mapSource").textContent = MAP.source;

render();
renderSpec();
renderChat();
fit();
</script>
